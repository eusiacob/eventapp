<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Notificări</title>

    <link rel="icon" th:href="@{/images/favicon.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="app-bg">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-3">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1 text-dark">Notificări</h1>
            <p class="text-muted mb-0" th:if="${showUnreadOnly}">Afișăm doar notificările necitite.</p>
            <p class="text-muted mb-0" th:unless="${showUnreadOnly}">Vezi toate actualizările contului tău.</p>
        </div>

        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-primary btn-sm"
               th:classappend="${showUnreadOnly ? '' : ' active'}"
               th:href="@{/notifications}">
                Toate
            </a>
            <a class="btn btn-outline-primary btn-sm"
               th:classappend="${showUnreadOnly ? ' active' : ''}"
               th:href="@{/notifications(unread=true)}">
                Necitite
            </a>
            <form method="post" th:action="@{/notifications/mark-all-read}">
                <input th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"
                       type="hidden">
                <button class="btn btn-primary btn-sm"
                        th:disabled="${notificationCount == 0}"
                        type="submit">
                    <i class="bi bi-check2-all me-1"></i>Marchează toate ca citite
                </button>
            </form>
        </div>
    </div>

    <div class="alert alert-success alert-dismissible fade show"
         role="alert"
         th:if="${notificationSuccess != null}">
        <span th:text="${notificationSuccess}"></span>
        <button aria-label="Închide" class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <section class="card border-0 shadow-sm overflow-hidden">
        <div class="navbar-notifications-empty"
             th:if="${#lists.isEmpty(notificationPageItems)}">
            <i class="bi bi-bell-slash"></i>
            <p class="mb-0" th:text="${showUnreadOnly ? 'Nu ai notificări necitite.' : 'Nu ai notificări.'}"></p>
        </div>

        <div class="navbar-notification-list"
             th:if="${!#lists.isEmpty(notificationPageItems)}">
            <a class="navbar-notification-entry"
               th:classappend="${notification.isRead ? '' : ' is-unread'}"
               th:each="notification : ${notificationPageItems}"
               th:href="@{/notifications/{id}(id=${notification.id})}">
                <i class="bi bi-bell"></i>

                <span class="flex-grow-1">
                    <strong th:text="${notification.title}"></strong>
                    <small th:text="${notification.message}"></small>
                    <small class="mt-2 text-secondary"
                           th:text="${#temporals.format(notification.createdAt, 'dd.MM.yyyy, HH:mm')}"></small>
                </span>

                <span class="badge text-bg-primary align-self-center" th:if="${!notification.isRead}">
                    Nouă
                </span>
            </a>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
