<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Home</title>
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .favorite-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .business-card-link {
            border-radius: 22px;
            height: 100%;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .business-card-link:hover {
            cursor: pointer;
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .favorite-title {
            margin: 0;

            color: #181818;

            font-weight: 700;

            letter-spacing: -.025em;
        }

        .empty-favorites {

            padding: 45px 20px;

            text-align: center;

            color: #888;

        }
    </style>

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!-- HEADER -->
    <header class="favorite-header">

        <h1 class="favorite-title">

            Servicii favorite

        </h1>

    </header>

    <!-- EMPTY STATE -->
    <div class="empty-favorites"
         th:if="${#lists.isEmpty(favorites)}">
        Nu ai servicii favorite.
    </div>


    <!--    CARDS-->
    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="p : ${favorites}">

            <div class="business-card-link"
                 th:data-url="@{/business/{uuid}(uuid=${p.uuid})}"
                 onclick="window.location=this.dataset.url">

                <div class="card shadow border-0 h-100">

                    <img alt="Imagine serviciu"
                         class="card-img-top"
                         loading="lazy"
                         style="height:250px; object-fit:cover;" th:src="@{${p.imagePath}}">

                    <div class="card-body">

                        <h4 class="fw-bold" th:text="${p.name}"></h4>

                        <p style="margin: 0" th:text="${p.city}"></p>

                        <span class="fs-6 text-warning">★</span>
                        <span class="premium-county" th:text="${#numbers.formatDecimal(p.averageRating, 1, 1)}"></span>

                        <form class="mt-2"
                              method="post"
                              th:action="@{/favorites/remove/{uuid}(uuid=${p.uuid})}">

                            <button class="btn btn-outline-danger">
                                Șterge
                            </button>

                        </form>

                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
