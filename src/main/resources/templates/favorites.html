<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Servicii favorite</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .favorite-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .favorite-title {
            margin: 0;

            color: #181818;

            font-weight: 700;

            letter-spacing: -.025em;
        }

        .empty-favorites {

            padding: 45px 20px;

            text-align: center;

            color: #888;

        }
    </style>

</head>
<body class="app-bg">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!-- HEADER -->
    <header class="favorite-header">

        <h1 class="favorite-title">

            Servicii favorite

        </h1>

    </header>

    <!-- EMPTY STATE -->
    <div class="empty-favorites"
         th:if="${#lists.isEmpty(favorites)}">
        Nu ai servicii favorite.
    </div>


    <!--    CARDS-->
    <div class="row g-3 mt-2 service-card-grid">

        <div class="col-6 col-md-6 col-lg-4 service-card-column"
             th:each="p : ${favorites}">

            <div class="card border-0 shadow-lg h-100 business-card position-relative">

                <div class="favorite-heart-wrapper">
                    <form method="post"
                          th:action="@{/favorites/remove/{uuid}(uuid=${p.uuid})}">
                        <button class="favorite-heart filled-heart"
                                type="submit"
                                th:aria-label="|Elimină ${p.name} din favorite|"
                                title="Elimină din favorite">
                            <span aria-hidden="true">♥</span>
                        </button>
                    </form>
                </div>

                <div class="position-relative">
                    <img alt="Imagine serviciu"
                         class="card-img-top business-image"
                         decoding="async"
                         height="480"
                         loading="lazy"
                         th:src="@{${p.coverImagePath}}"
                         width="640">

                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="fw-bold mb-2 business-card-title">
                        <a class="stretched-link text-reset text-decoration-none"
                           th:href="@{/business/{uuid}(uuid=${p.slug})}"
                           th:text="${p.name}"></a>
                    </h5>

                    <p class="text-muted mb-2 business-card-location">
                        <i aria-hidden="true" class="bi bi-geo-alt-fill business-card-location-icon"></i>
                        <span class="business-card-location-text" th:text="${p.city}"></span>
                    </p>

                    <div class="mb-2 business-card-reviews">
                        <span class="text-muted" th:if="${p.reviewCount == 0}">
                            Nici o recenzie.
                        </span>
                        <span th:if="${p.reviewCount > 0}">
                            <span class="text-warning">★</span>
                            <span th:text="${#numbers.formatDecimal(p.averageRating, 1, 1)}"></span>
                            <span class="text-muted">
                                (<span th:text="${p.reviewCount}"></span>
                                <span th:text="${p.reviewCount == 1 ? 'recenzie' : 'recenzii'}"></span>)
                            </span>
                        </span>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
