<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Home</title>
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!-- EMPTY STATE -->
    <div class="text-muted mt-4"
         th:if="${#lists.isEmpty(favorites)}">
        Nu ai servicii favorite.
    </div>


    <!--    CARDS-->
    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="p : ${favorites}">

            <a class="business-card-link" th:href="@{/business/{uuid}(uuid=${p.uuid})}">
                <div class="card shadow border-0 h-100">

                    <img class="card-img-top"
                         loading="lazy"
                         style="height:250px; object-fit:cover;"
                         th:src="@{${p.imagePath}}">

                    <div class="card-body">

                        <h4 th:text="${p.name}" class="fw-bold"></h4>

                        <p th:text="${p.city}" style="margin: 0"></p>

                        <span class="fs-6 text-warning">★</span>
                        <span class="premium-county" th:text="${#numbers.formatDecimal(p.averageRating, 1, 1)}"></span>

                        <form class="mt-2"
                              method="post"
                              th:action="@{/favorites/remove/{uuid}(uuid=${p.uuid})}">

                            <button class="btn btn-outline-danger">
                                Șterge
                            </button>

                        </form>

                    </div>

                </div>
            </a>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
