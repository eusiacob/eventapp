<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Adaugă un serviciu | M-Event</title>

    <link rel="icon" th:href="@{/images/favicon.png}" type="image/png">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>
        .crop-container {
            width: 100%;
            max-height: 70vh;
            overflow: hidden;
            background: #f1f1f1;
        }

        .crop-container img {
            display: block;
            max-width: 100%;
        }
    </style>
</head>

<body class="business-editor-page" style="overflow: auto">

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- PAGE -->
<div class="container mt-2">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="row justify-content-center">

        <div class="col-12 col-lg-10 col-xl-9">

            <div class="card business-editor-card shadow-sm border-0">

                <div class="alert-danger mb-2"
                     style="color: red"
                     th:if="${error}"
                     th:text="${error}">
                </div>

                <div class="alert alert-danger mb-2"
                     th:if="${imageError}"
                     th:text="${imageError}">
                </div>

                <h1 class="h4 mb-2">Adaugă un serviciu</h1>
                <p class="text-muted small mb-3">Prezintă oferta ta. După salvare poți adăuga fotografii, videoclipuri
                    și disponibilitatea.</p>

                <form class="business-editor-form" enctype="multipart/form-data"
                      method="post"
                      th:action="@{/business/create}"
                      th:object="${profile}">

                    <div th:replace="~{fragments/business-form-fields :: fields(false)}"></div>
                    <div class="business-form-actions">
                        <a class="btn btn-outline-secondary" href="/businesses">Renunță</a>
                        <button class="btn btn-primary" type="submit">Adaugă serviciul</button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/image-cropper.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

<!-- IMAGE CROP MODAL -->
<div aria-hidden="true" class="modal fade" id="cropModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    Decupează imaginea
                </h5>

                <button aria-label="Închide"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        type="button">
                </button>
            </div>

            <div class="modal-body">

                <div class="crop-container">
                    <img alt="Imagine pentru decupare"
                         id="cropImage"
                         src="">
                </div>

                <div class="d-flex justify-content-center gap-2 mt-3">

                    <button class="btn btn-outline-secondary"
                            id="zoomOutButton"
                            type="button">
                        <i class="bi bi-dash-lg"></i>
                    </button>

                    <button class="btn btn-outline-secondary"
                            id="zoomInButton"
                            type="button">
                        <i class="bi bi-plus-lg"></i>
                    </button>

                    <button class="btn btn-outline-secondary"
                            id="rotateButton"
                            type="button">
                        <i class="bi bi-arrow-clockwise"></i>
                        <span class="d-none d-sm-inline">Rotește</span>
                    </button>

                </div>

                <div class="form-text mt-2">
                    Ajustează imaginea astfel încât zona dorită să fie
                    încadrată în dreptunghiul 4:3.
                </div>

            </div>

            <div class="modal-footer">

                <button class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                        type="button">
                    Anulează
                </button>

                <button class="btn btn-dark"
                        id="cropConfirmButton"
                        type="button">
                    <i class="bi bi-check-lg"></i>
                    Confirmă decuparea
                </button>

            </div>

        </div>
    </div>
</div>


<script th:src="@{/js/service-area.js}"></script>
<script th:src="@{/js/business-options.js}"></script>
<script th:src="@{/js/business-form-errors.js}"></script>
</body>
</html>
