<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <style>

        .support-messages {
            height: 250px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            border-radius: 10px;
        }


        .support-message-bubble {
            display: inline-block;
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            text-align: left;
            word-break: break-word;
        }


        .support-message-user {
            background-color: #212529;
            color: white;
            border-bottom-right-radius: 4px;
        }


        .support-message-admin {
            background-color: #f1f1f1;
            color: #212529;
            border-bottom-left-radius: 4px;
        }


        @media (max-width: 576px) {

            .support-messages {
                height: 200px;
            }

            .support-message-bubble {
                max-width: 90%;
            }

        }

    </style>

    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">

    <title th:text="'Support #' + ${ticket.id}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-4">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>


    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">


            <!-- HEADER -->

            <div class="d-flex justify-content-between align-items-start mb-3">

                <div>

                    <h3 class="text-dark fw-bold mb-1"
                        th:text="${ticket.subject}">
                    </h3>

                    <div class="text-muted small">

                        #

                        <span th:text="${ticket.id}">
                        </span>

                        ·

                        <span th:text="${ticket.category}">
                        </span>

                    </div>

                </div>


                <!-- STATUS -->

                <span class="badge"

                      th:classappend="

                      ${ticket.status.name() == 'OPEN'}
                      ? ' bg-success'

                      : (${ticket.status.name() == 'IN_PROGRESS'}
                      ? ' bg-warning text-dark'

                      : ' bg-secondary')

                      "

                      th:text="

                      ${ticket.status.name() == 'OPEN'}
                      ? 'Deschis'

                      : (${ticket.status.name() == 'IN_PROGRESS'}
                      ? 'În lucru'

                      : 'Închis')

                      ">

                </span>

            </div>


            <!-- ERROR -->

            <div class="alert alert-danger"
                 th:if="${supportError}"
                 th:text="${supportError}">
            </div>


            <!-- SUCCESS -->

            <div class="alert alert-success"
                 th:if="${supportSuccess}"
                 th:text="${supportSuccess}">
            </div>


            <!-- CHAT -->

            <div class="card border-0 shadow-sm">

                <div class="card-body p-3 p-md-4">


                    <!-- MESSAGES -->

                    <div class="support-messages"
                         id="supportMessages">


                        <div class="mb-3"

                             th:classappend="${message.user.id == ticket.user.id}
                                            ? ' text-end'
                                            : ' text-start'"

                             th:each="message : ${messages}">


                            <div class="small text-muted mb-1">

                                <span th:if="${message.user.id == ticket.user.id}">
                                    Tu
                                </span>

                                <span th:if="${message.user.id != ticket.user.id}">
                                    Administrator
                                </span>

                            </div>


                            <div class="support-message-bubble"

                                 th:classappend="${message.user.id == ticket.user.id}
                                                ? ' support-message-user'
                                                : ' support-message-admin'">

                                <div th:text="${message.message}">
                                </div>

                            </div>


                            <div class="small text-muted mt-1">

                                <span th:text="${#temporals.format(message.createdAt, 'dd.MM.yyyy HH:mm')}">
                                </span>

                            </div>

                        </div>


                    </div>


                    <!-- MESSAGE FORM -->

                    <div th:if="${ticket.status.name() != 'CLOSED'}">

                        <hr>


                        <form method="post"
                              th:action="@{/support/{id}/message(id=${ticket.id})}">


                            <!-- CSRF -->

                            <input th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"
                                   type="hidden">


                            <div class="mb-3">

                                <textarea class="form-control"
                                          maxlength="5000"
                                          name="message"
                                          placeholder="Scrie un mesaj..."
                                          required
                                          rows="2"></textarea>

                                <div class="form-text">
                                    Maximum 5000 de caractere.
                                </div>

                            </div>


                            <div class="d-flex justify-content-between">

                                <a class="btn btn-outline-secondary p-2"
                                   th:href="@{/support}">

                                    <i class="bi bi-arrow-left"></i>

                                    Înapoi

                                </a>


                                <button class="btn btn-dark p-2"
                                        type="submit">

                                    <i class="bi bi-send"></i>

                                    Trimite

                                </button>

                            </div>

                        </form>

                    </div>


                    <!-- CLOSED -->

                    <div class="alert alert-secondary mb-0"
                         th:if="${ticket.status.name() == 'CLOSED'}">

                        <i class="bi bi-lock"></i>

                        Această solicitare a fost închisă și nu mai poate
                        primi mesaje.

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- SCROLL LA ULTIMUL MESAJ -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const messages =
            document.getElementById("supportMessages");

        if (!messages) {
            return;
        }

        messages.scrollTop =
            messages.scrollHeight;

    });

</script>


</body>

</html>
