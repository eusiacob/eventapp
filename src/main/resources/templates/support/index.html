<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">

    <title>Support</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-4">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h3 class="text-dark fw-bold mb-1">
                Support
            </h3>

            <p class="text-muted mb-0">
                Ai nevoie de ajutor? Trimite-ne o solicitare.
            </p>

        </div>


        <a class="btn btn-dark m-2 p-2"
           th:href="@{/support/new}">

            <h3 class="m-0">
                <i class="bi bi-send-plus"></i>
            </h3>

        </a>

    </div>


    <!-- SUCCESS -->

    <div class="alert alert-success"
         th:if="${supportSuccess}"
         th:text="${supportSuccess}">
    </div>


    <!-- ERROR -->

    <div class="alert alert-danger"
         th:if="${supportError}"
         th:text="${supportError}">
    </div>


    <!-- EMPTY -->

    <div class="card border-0 shadow-sm"
         th:if="${#lists.isEmpty(tickets)}">

        <div class="card-body text-center py-5">

            <i class="bi bi-chat-square-text"
               style="font-size: 3rem;">
            </i>

            <h5 class="fw-bold mt-3">
                Nu ai nicio solicitare
            </h5>

            <p class="text-muted">
                Dacă întâmpini o problemă, poți deschide o
                solicitare către echipa de suport.
            </p>

            <a class="btn btn-outline-dark"
               th:href="@{/support/new}">

                Deschide o solicitare

            </a>

        </div>

    </div>


    <!-- TICKETS -->

    <div class="row g-3"
         th:if="${!#lists.isEmpty(tickets)}">

        <div class="col-12"
             th:each="ticket : ${tickets}">

            <a class="text-decoration-none text-dark"
               th:href="@{/support/{id}(id=${ticket.id})}">

                <div class="card border-0 shadow-sm support-ticket-card">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-start">


                            <div>

                                <h5 class="fw-bold mb-1"
                                    th:text="${ticket.subject}">
                                </h5>

                                <small class="text-muted">

                                    #
                                    <span th:text="${ticket.id}">
                                    </span>

                                    ·

                                    <span th:text="${ticket.category}">
                                    </span>

                                </small>

                            </div>


                            <!-- STATUS -->

                            <span class="badge"

                                  th:classappend="

                                  ${ticket.status.name() == 'OPEN'}
                                  ? ' bg-success'

                                  : (${ticket.status.name() == 'IN_PROGRESS'}
                                  ? ' bg-warning text-dark'

                                  : ' bg-secondary')

                                  "

                                  th:text="

                                  ${ticket.status.name() == 'OPEN'}
                                  ? 'Deschis'

                                  : (${ticket.status.name() == 'IN_PROGRESS'}
                                  ? 'În lucru'

                                  : 'Închis')

                                  ">

                            </span>

                        </div>


                        <div class="mt-3 text-muted small">

                            <i class="bi bi-clock"></i>

                            Actualizat:

                            <span th:text="${#temporals.format(ticket.updatedAt, 'dd.MM.yyyy HH:mm')}">
                            </span>

                        </div>


                    </div>

                </div>

            </a>

        </div>

    </div>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
