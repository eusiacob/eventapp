<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

  <meta charset="UTF-8">

  <meta content="width=device-width, initial-scale=1.0"
        name="viewport">

  <title>Solicitare support</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-4">

  <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>


  <div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-7">

      <div class="card border-0 shadow-sm">

        <div class="card-body p-4">

          <div class="mb-4">

            <h3 class="text-dark fw-bold mb-1">
              Solicitare nouă
            </h3>

            <p class="text-muted mb-0">
              Descrie problema întâmpinată și echipa de suport
              îți va răspunde cât mai curând.
            </p>

          </div>


          <!-- ERROR -->

          <div class="alert alert-danger"
               th:if="${supportError}"
               th:text="${supportError}">
          </div>


          <form method="post"
                th:action="@{/support/new}"
                th:object="${ticket}">


            <!-- CSRF -->

            <input th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"
                   type="hidden">


            <!-- SUBJECT -->

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Subiect
              </label>

              <input class="form-control"
                     maxlength="150"
                     name="subject"
                     placeholder="Ex: Problemă cu abonamentul"
                     required
                     th:field="*{subject}"
                     type="text">

            </div>


            <!-- CATEGORY -->

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Categorie
              </label>

              <select class="form-select"
                      name="category"
                      required
                      th:field="*{category}">

                <option disabled
                        selected
                        value="">
                  Selectează categoria
                </option>

                <option th:each="category : ${T(com.example.eventapp.model.SupportTicket.SupportCategory).values()}"
                        th:text="${category}"
                        th:value="${category}">
                </option>

              </select>

            </div>


            <!-- MESSAGE -->

            <div class="mb-4">

              <label class="form-label fw-semibold">
                Mesaj
              </label>

              <textarea class="form-control"
                        maxlength="5000"
                        name="message"
                        placeholder="Descrie problema cât mai detaliat..."
                        required
                        rows="7"
                        th:text="${message}">
                            </textarea>

              <div class="form-text">
                Maximum 5000 de caractere.
              </div>

            </div>


            <!-- BUTTONS -->

            <div class="d-flex justify-content-between">

              <a class="btn btn-outline-secondary"
                 th:href="@{/support}">

                <i class="bi bi-arrow-left"></i>

                Înapoi

              </a>


              <button class="btn btn-dark"
                      type="submit">

                <i class="bi bi-send"></i>

                Trimite solicitarea

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
