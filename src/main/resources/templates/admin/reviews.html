<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Moderare recenzii</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ADMIN PAGE -->
<div class="container py-4">

    <h5 class="fw-bold mb-3 text-dark">

        Moderare recenzii

    </h5>

    <!-- FILTRE -->

    <div class="d-flex flex-wrap gap-3 mb-3">

        <a class="admin-filter-btn all"
           th:classappend="${selectedStatus == null} ? ' active'"
           th:href="@{/admin/reviews}">

            Toate

        </a>

        <a class="admin-filter-btn pending"
           th:classappend="${selectedStatus?.name() == 'PENDING'} ? ' active'"
           th:href="@{/admin/reviews(status='PENDING')}">

            În așteptare

        </a>

        <a class="admin-filter-btn approved"
           th:classappend="${selectedStatus?.name() == 'APPROVED'} ? ' active'"
           th:href="@{/admin/reviews(status='APPROVED')}">

            Aprobate

        </a>

        <a class="admin-filter-btn rejected"
           th:classappend="${selectedStatus?.name() == 'REJECTED'} ? ' active'"
           th:href="@{/admin/reviews(status='REJECTED')}">

            Respinse

        </a>

    </div>


    <!-- LISTA -->

    <span class="text-muted"
          th:text="${reviews.size()} + ' recenzii'">
        </span>

    <div class="card border-0 shadow-sm rounded-4 mt-2">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle table-hover">

                    <thead>

                    <tr>

                        <th>Business</th>

                        <th>Autor</th>

                        <th>Rating</th>

                        <th>Recenzie</th>

                        <th>Status</th>

                        <th>Data</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr class="clickable-row"

                        th:data-href="@{/admin/review/{id}(id=${review.id})}"

                        th:each="review : ${reviews}">

                        <td class="fw-semibold"
                            th:text="${review.businessProfile.name}">

                        </td>

                        <td
                                th:text="${review.user.firstName + ' ' + review.user.lastName}">
                        </td>

                        <td>

                <span th:each="i : ${#numbers.sequence(1, review.rating)}">

                    <i class="bi bi-star-fill text-warning"></i>

                </span>

                        </td>

                        <td style="max-width:350px;"
                            th:text="${#strings.abbreviate(review.comment,80)}">
                        </td>

                        <td>

                <span class="badge"

                      th:classappend="
                            ${review.reviewStatus.name == 'APPROVED'} ? 'bg-success' :
                            (${review.reviewStatus.name == 'REJECTED'} ? 'bg-danger' :
                            'bg-warning text-dark')"

                      th:text="${review.reviewStatus}">

                </span>

                        </td>

                        <td
                                th:text="${#temporals.format(review.createdAt,'dd.MM.yyyy')}">
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- NU EXISTA RECENZII -->

    <div class="text-center py-5"
         th:if="${reviews.isEmpty()}">

        <i class="bi bi-chat-left-text"
           style="font-size:60px;color:#ced4da;"></i>

        <h5 class="mt-3">

            Nu există recenzii.

        </h5>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!--ACTION BUTTONS FOR REVIEW-->
<script>

    document.addEventListener("DOMContentLoaded", function () {

        document.querySelectorAll(".clickable-row")

            .forEach(function (row) {

                row.addEventListener("click", function () {

                    window.location = this.dataset.href;

                });

            });

    });

</script>
</body>
</html>
