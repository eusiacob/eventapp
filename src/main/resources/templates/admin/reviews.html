<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Moderare recenzii</title>

    <link rel="icon" th:href="@{/images/favicon.png}" type="image/png">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ADMIN PAGE -->
<div class="container py-4" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!-- FILTRE -->
    <div class="d-flex flex-wrap gap-3 mb-3">

        <a class="admin-filter-btn all"
           th:classappend="${selectedStatus == null} ? ' active'"
           th:href="@{/admin/reviews(search=${search}, size=${size}, sort=${sort})}">

            Toate

        </a>

        <a class="admin-filter-btn pending"
           th:classappend="${selectedStatus?.name() == 'PENDING'} ? ' active'"
           th:href="@{/admin/reviews(status='PENDING', search=${search}, size=${size}, sort=${sort})}">

            În așteptare

        </a>

        <a class="admin-filter-btn approved"
           th:classappend="${selectedStatus?.name() == 'APPROVED'} ? ' active'"
           th:href="@{/admin/reviews(status='APPROVED', search=${search}, size=${size}, sort=${sort})}">

            Aprobate

        </a>

        <a class="admin-filter-btn rejected"
           th:classappend="${selectedStatus?.name() == 'REJECTED'} ? ' active'"
           th:href="@{/admin/reviews(status='REJECTED', search=${search}, size=${size}, sort=${sort})}">

            Respinse

        </a>

    </div>

    <form class="row g-2 align-items-end mb-3"
          method="get"
          th:action="@{/admin/reviews}">
        <input name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}" type="hidden">
        <input name="page" type="hidden" value="0">
        <div class="col-12 col-md-7 col-lg-5">
            <label class="form-label text-dark" for="reviewSearch">Caută recenzii</label>
            <input class="form-control"
                   id="reviewSearch"
                   name="search"
                   placeholder="Numele serviciului sau autorul"
                   th:value="${search}"
                   type="search">
        </div>
        <div class="col-12 col-md-auto d-flex gap-2">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-search me-1"></i>Caută
            </button>
            <a class="btn btn-outline-secondary"
               th:href="@{/admin/reviews(status=${selectedStatus}, size=${size}, sort=${sort})}">
                Reset
            </a>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label text-dark" for="reviewSort">Sortează</label>
            <select class="form-select" id="reviewSort" name="sort" onchange="this.form.submit()">
                <option value="newest" th:selected="${sort == 'newest'}">Cele mai noi</option>
                <option value="oldest" th:selected="${sort == 'oldest'}">Cele mai vechi</option>
                <option value="ratingDesc" th:selected="${sort == 'ratingDesc'}">Rating descrescător</option>
                <option value="ratingAsc" th:selected="${sort == 'ratingAsc'}">Rating crescător</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label text-dark" for="reviewSize">Pe pagină</label>
            <select class="form-select" id="reviewSize" name="size" onchange="this.form.submit()">
                <option value="5" th:selected="${size == 5}">5</option>
                <option value="10" th:selected="${size == 10}">10</option>
                <option value="20" th:selected="${size == 20}">20</option>
            </select>
        </div>
    </form>

    <!-- LISTA -->
    <span class="text-muted"
          th:text="${reviews.totalElements}">
        </span>

    <span class="text-muted"
          th:text="${reviews.totalElements} == 1 ? ' recenzie': ' recenzii'">
        </span>

    <div class="admin-entity-list admin-review-list" th:if="${not reviews.isEmpty()}">
        <a class="admin-entity-row admin-review-row"
           th:each="review : ${reviews}"
           th:href="@{/admin/review/{id}(id=${review.id})}">
            <div class="admin-entity-main admin-review-main">
                <div class="admin-review-heading">
                    <h2 class="admin-entity-title" th:text="${review.businessProfile.name}"></h2>
                    <span class="admin-review-author">
                        <i aria-hidden="true" class="bi bi-person"></i>
                        <span th:text="${review.user.firstName + ' ' + review.user.lastName}"></span>
                    </span>
                </div>
                <p class="admin-review-excerpt" th:text="${#strings.abbreviate(review.comment, 160)}"></p>
            </div>

            <div class="admin-entity-footer admin-review-footer">
                <span class="admin-review-rating" role="img"
                      th:aria-label="|Rating: ${review.rating} din 5|">
                    <i aria-hidden="true" class="bi bi-star-fill text-warning"
                       th:each="i : ${#numbers.sequence(1, review.rating)}"></i>
                    <span aria-hidden="true" th:text="|${review.rating}/5|"></span>
                </span>
                <span class="badge admin-entity-status"
                      th:classappend="${review.reviewStatus.name == 'APPROVED'} ? 'bg-success' : (${review.reviewStatus.name == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                      th:text="${review.reviewStatus.reviewStatusName}"></span>
                <time class="admin-entity-date"
                      th:datetime="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}"
                      th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy')}"></time>
            </div>

            <i aria-hidden="true" class="bi bi-chevron-right admin-entity-chevron"></i>
        </a>
    </div>

    <nav aria-label="Paginare recenzii" class="mt-4" th:if="${reviews.totalPages > 1}">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${reviews.first} ? ' disabled'"><a class="page-link" th:href="@{/admin/reviews(status=${selectedStatus}, search=${search}, size=${size}, sort=${sort}, page=${reviews.number - 1})}">Anterior</a></li>
            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, reviews.totalPages - 1)}" th:classappend="${pageNumber == reviews.number} ? ' active'"><a class="page-link" th:text="${pageNumber + 1}" th:href="@{/admin/reviews(status=${selectedStatus}, search=${search}, size=${size}, sort=${sort}, page=${pageNumber})}"></a></li>
            <li class="page-item" th:classappend="${reviews.last} ? ' disabled'"><a class="page-link" th:href="@{/admin/reviews(status=${selectedStatus}, search=${search}, size=${size}, sort=${sort}, page=${reviews.number + 1})}">Următoarea</a></li>
        </ul>
    </nav>

    <!-- NU EXISTA RECENZII -->
    <div class="text-center py-5"
         th:if="${reviews.isEmpty()}">

        <i class="bi bi-chat-left-text"
           style="font-size:60px;color:#ced4da;"></i>

        <h5 class="mt-3 text-dark">

            Nu există recenzii.

        </h5>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
