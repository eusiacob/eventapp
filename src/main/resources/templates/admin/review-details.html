<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moderare recenzie</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--MAIN PAGE-->
<div class="container py-4">


    <div class="d-flex justify-content-between align-items-center mb-4">


        <h4 class="fw-bold mb-3 text-dark">

            Detalii recenzie

        </h4>

        <a class="btn btn-outline-secondary"
           th:href="@{/admin/reviews}">

            <i class="bi bi-arrow-left"></i>

            Înapoi

        </a>

    </div>

  <div class="alert alert-success" style="padding: 0.5em" th:if="${param.reviewApproved}">
    Recenzia a fost aprobată!
  </div>

  <div class="alert alert-danger" style="padding: 0.5em" th:if="${param.reviewRejected}">
    Recenzia a fost respinsă!
  </div>

    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <!-- BUSINESS -->

            <h5 class="fw-bold mb-3">

                <i class="bi bi-building"></i>

                Business

            </h5>

            <p class="mb-4"
               th:text="${review.businessProfile.name}">

                Nume business

            </p>

            <hr>

            <!-- USER -->

            <h5 class="fw-bold mb-3">

                <i class="bi bi-person"></i>

                Autor

            </h5>


            <p class="mb-4"
               th:text="${review.user.firstName + ' ' + review.user.lastName}">

                User

            </p>


            <hr>


            <!-- RATING -->


            <h5 class="fw-bold mb-3">

                Rating

            </h5>


            <div class="mb-4">


                <i class="bi bi-star-fill text-warning"
                   th:each="i : ${#numbers.sequence(1, review.rating)}">

                </i>


            </div>


            <hr>


            <!-- COMMENT -->


            <h5 class="fw-bold mb-3">

                Recenzie

            </h5>


            <p class="text-muted"
               th:text="${review.comment}">

                Text recenzie

            </p>


            <hr>


            <!-- STATUS -->


            <h5 class="fw-bold mb-3">

                Status

            </h5>


            <span class="badge fs-6"

                  th:classappend="
                  ${review.reviewStatus.name == 'APPROVED'} ? ' bg-success' :
                  (${review.reviewStatus.name == 'REJECTED'} ? ' bg-danger' :
                  ' bg-warning text-dark')"

                  th:text="${review.reviewStatus.name}">

            </span>

          <div class="mt-4 d-flex gap-3">


            <!-- APROBARE -->

            <form th:if="${review.reviewStatus.name != 'APPROVED'}"
                  th:action="@{/admin/review/{id}/approve(id=${review.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

              <button class="btn btn-success">

                <i class="bi bi-check-circle"></i>

                Aprobă recenzia

              </button>


            </form>



            <!-- RESPINGERE -->


            <form th:if="${review.reviewStatus.name != 'REJECTED'}"
                  th:action="@{/admin/review/{id}/reject(id=${review.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

              <button class="btn btn-danger">

                <i class="bi bi-x-circle"></i>

                Respinge recenzia

              </button>


            </form>


          </div>

            <div class="mt-4 text-muted small">


                <i class="bi bi-calendar"></i>


                <span th:text="${#temporals.format(review.createdAt,'dd.MM.yyyy')}">

                </span>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
