<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Moderare recenzie</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--MAIN PAGE-->
<div class="container py-4">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="alert alert-success" style="padding: 0.5em" th:if="${param.reviewApproved}">
        Recenzia a fost aprobată!
    </div>

    <div class="alert alert-danger" style="padding: 0.5em" th:if="${param.reviewRejected}">
        Recenzia a fost respinsă!
    </div>

    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <!-- BUSINESS -->

            <h5 class="fw-bold mb-3">

                <i class="bi bi-building"></i>

                Business

            </h5>

            <p class="mb-4"
               th:text="${review.businessProfile.name}">

                Nume business

            </p>

            <hr>

            <!-- USER -->

            <h5 class="fw-bold mb-3">

                <i class="bi bi-person"></i>

                Autor

            </h5>


            <p class="mb-4"
               th:text="${review.user.firstName + ' ' + review.user.lastName}">

                User

            </p>


            <hr>


            <!-- RATING -->


            <h5 class="fw-bold mb-3">

                Rating

            </h5>


            <div class="mb-4">


                <i class="bi bi-star-fill text-warning"
                   th:each="i : ${#numbers.sequence(1, review.rating)}">

                </i>


            </div>


            <hr>


            <!-- COMMENT -->


            <h5 class="fw-bold mb-3">

                Recenzie

            </h5>


            <p class="text-muted"
               th:text="${review.comment}">

                Text recenzie

            </p>


            <hr>


            <!-- STATUS -->


            <h5 class="fw-bold mb-3">

                Status

            </h5>


            <span class="badge fs-6"

                  th:classappend="
                  ${review.reviewStatus.name == 'APPROVED'} ? ' bg-success' :
                  (${review.reviewStatus.name == 'REJECTED'} ? ' bg-danger' :
                  ' bg-warning text-dark')"

                  th:text="${review.reviewStatus.name}">

            </span>

            <div class="mt-4"
                 th:if="${review.reviewStatus.name() == 'REJECTED'
              and review.rejectionReason != null
              and !#strings.isEmpty(review.rejectionReason)}">

                <h5 class="fw-bold">

                    Motivul respingerii

                </h5>

                <div class="alert alert-danger mt-3 mb-0">

                    <i class="bi bi-exclamation-circle-fill me-2"></i>

                    <span th:text="${review.rejectionReason}">

                    </span>

                </div>

            </div>

            <div class="mt-4 d-flex gap-3">

                <!-- APROBARE -->
                <form method="post"
                      th:action="@{/admin/review/{id}/approve(id=${review.id})}"
                      th:if="${review.reviewStatus.name != 'APPROVED'}">

                    <input th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"
                           type="hidden">

                    <button class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Aprobă recenzia

                    </button>


                </form>

                <!-- RESPINGERE -->
                <form method="post"
                      th:action="@{/admin/review/{id}/reject(id=${review.id})}"
                      th:if="${review.reviewStatus.name != 'REJECTED'}">

                    <input th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"
                           type="hidden">

                    <button class="btn btn-danger"

                            data-bs-target="#rejectReviewModal"

                            data-bs-toggle="modal"

                            th:if="${review.reviewStatus.name != 'REJECTED'}"

                            type="button">

                        <i class="bi bi-x-circle"></i>

                        Respinge recenzia

                    </button>

                </form>

            </div>

            <div class="mt-4 text-muted small">


                <i class="bi bi-calendar"></i>


                <span th:text="${#temporals.format(review.createdAt,'dd.MM.yyyy')}">

                </span>

            </div>

        </div>

    </div>

</div>


<!--MODAL REJECTION REVIEW-->
<div class="modal fade"
     id="rejectReviewModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form method="post"
                  th:action="@{/admin/review/{id}/reject(id=${review.id})}">

                <input th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"
                       type="hidden">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Respinge recenzia

                    </h5>

                    <button class="btn-close"
                            data-bs-dismiss="modal"
                            type="button">
                    </button>

                </div>


                <div class="modal-body">

                    <label class="form-label">

                        Motivul respingerii (obligatoriu)

                    </label>

                    <div class="text-danger small mb-2 d-none"
                         id="rejectReasonError">

                        Introduceți motivul respingerii.

                    </div>

                    <textarea
                            class="form-control"
                            maxlength="500"
                            name="reason"
                            placeholder="Introduceți motivul respingerii..."
                            required
                            rows="5">
                    </textarea>

                    <div class="form-text">

                        Acest motiv va fi trimis utilizatorului.

                    </div>

                </div>


                <div class="modal-footer">

                    <button class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                            type="button">

                        Renunță

                    </button>

                    <button class="btn btn-danger"
                            type="submit">

                        Respinge recenzia

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!--MODAL JAVASCRIPT-->
<script>

    document.querySelector('#rejectReviewModal form')

        .addEventListener('submit', function (e) {

            const textarea = this.querySelector('textarea');

            const error = document.getElementById('rejectReasonError');

            if (textarea.value.trim() === '') {

                e.preventDefault();

                error.classList.remove('d-none');

                textarea.focus();

                return;

            }

            error.classList.add('d-none');

        });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
