<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title th:text="${business.name}"></title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="alert alert-success" style="padding: 0.5em" th:if="${param.success}">
        Serviciul a fost aprobat!
    </div>

    <div class="alert alert-danger" style="padding: 0.5em" th:if="${param.rejected}">
        Serviciul a fost respins!
    </div>

    <div class="card shadow-sm border-0 rounded-4">

        <img alt="Imagine serviciu"
             class="details-image"
             th:src="@{${business.imagePath}}">

        <div class="row mt-4">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0 rounded-4 mb-4">

                    <div class="card-body">

                        <h4 class="mb-3">
                            Descriere
                        </h4>

                        <p th:text="${business.description}">
                        </p>

                        <hr>

                        <div class="row gy-3 mb-2">

                            <div class="col-md-6">

                                <strong>Telefon</strong>

                                <div th:text="${business.phone}"></div>

                            </div>

                            <div class="col-md-6">

                                <strong>Email</strong>

                                <div th:text="${business.email}"></div>

                            </div>

                            <div class="col-md-6">

                                <strong>Website</strong>

                                <div>

                                    <a target="_blank"
                                       th:href="${business.website}"
                                       th:text="${business.website}">
                                    </a>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <strong>Oraș</strong>

                                <div th:text="${business.city}"></div>

                            </div>

                        </div>

                        <!-- FOTOGRAFII -->
                        <div th:if="${business.galleryImages != null and !#lists.isEmpty(business.galleryImages)}">

                            <div class="gallery-section-title">
                                <i class="bi bi-images"></i>
                                Fotografii
                            </div>

                            <div class="gallery-photo-grid">

                                <div class="gallery-photo-item"
                                     th:classappend="${iterStat.index >= 5} ? ' gallery-extra-image' : ''"
                                     th:each="img, iterStat : ${business.galleryImages}">

                                    <img alt="Previzualizează fotografia galeriei"
                                         class="gallery-thumbnail"
                                         data-bs-target="#galleryImagePreviewModal"
                                         data-bs-toggle="modal"
                                         data-gallery-image-preview
                                         loading="lazy"
                                         role="button"
                                         style="cursor: pointer;"
                                         th:data-image-src="@{${img.imagePath}}"
                                         th:src="@{${img.imagePath}}"
                                         tabindex="0">

                                </div>

                            </div>

                            <button class="btn btn-sm btn-outline-secondary gallery-more-btn"
                                    id="showMoreImagesBtn"
                                    onclick="showMoreImages()"
                                    th:if="${business.galleryImages.size() > 5}"
                                    type="button">

                                <i class="bi bi-grid-3x3-gap"></i>

                                Vezi toate fotografiile
                                (<span th:text="${business.galleryImages.size()}"></span>)

                            </button>

                        </div>


                        <!-- VIDEOCLIPURI -->
                        <div class="gallery-videos-section"
                             th:if="${business.galleryVideos != null and !business.galleryVideos.isEmpty()}">

                            <div class="gallery-section-title">
                                <i class="bi bi-play-circle"></i>
                                Videoclipuri
                            </div>

                            <div class="gallery-video-grid">

                                <div class="gallery-video-item"
                                     th:each="video : ${business.galleryVideos}">

                                    <div aria-label="Redă videoclipul pe tot ecranul"
                                         class="video-preview"
                                         data-fullscreen-video
                                         role="button"
                                         tabindex="0">

                                        <video class="gallery-video-preview"
                                               muted
                                               playsinline
                                               th:poster="${#strings.replace(video.videoPath, '.mp4', '.jpg')}"
                                               preload="metadata">

                                            <source th:src="${video.videoPath}"
                                                    type="video/mp4">

                                        </video>

                                        <div class="video-play-button">
                                            <i class="bi bi-play-fill"></i>
                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="m-3" th:if="${#lists.isEmpty(business.galleryImages)}">
                    Utilizatorul nu are imagini în galerie.
                </div>

            </div>

            <div class="col-lg-4">

                <div class="card shadow-sm border-0 rounded-4 sticky-top"
                     style="top:90px;">

                    <div class="card-body">

                        <h5 class="mb-4">
                            Moderare
                        </h5>

                        <div class="mb-3">

                            <strong>Status</strong>

                            <div th:text="${business.status}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <strong>Owner</strong>

                            <div th:text="${business.user.firstName + ' ' + business.user.lastName}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <strong>Email owner</strong>

                            <div th:text="${business.user.email}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <strong>Creat la</strong>

                            <div th:text="${#temporals.format(business.createdAt,'dd.MM.yyyy')}">
                            </div>

                        </div>

                        <hr>

                        <div class="d-flex gap-2">

                            <form method="post"
                                  th:action="@{/admin/business/{uuid}/approve(uuid=${business.uuid})}"
                                  th:if="${business.status.name() != 'APPROVED'}">

                                <button class="btn btn-success">
                                    <i class="bi bi-check-circle"></i>
                                    Aprobă serviciul
                                </button>

                            </form>


                            <button class="btn btn-danger"
                                    data-bs-target="#rejectModal"
                                    data-bs-toggle="modal"
                                    th:if="${business.status.name() != 'REJECTED'}">

                                <i class="bi bi-x-circle"></i>
                                Respinge serviciul

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-start">

                <div>

                    <h2 class="fw-bold"
                        th:text="${business.name}">
                    </h2>

                    <div class="text-muted mb-0">

                        <div th:text="${business.category.displayName}"></div>

                        <div th:text="${business.city}"></div>

                    </div>


                </div>

                <span class="badge fs-6"
                      th:classappend="
                            ${business.status.name() == 'PENDING'} ? ' bg-warning text-dark' :
                            (${business.status.name() == 'APPROVED'} ? ' bg-success' : ' bg-danger')"
                      th:text="${business.status.statusDisplayName}">
                </span>

            </div>

            <hr>

            <p class="text-muted">

                Trimis pe

                <strong
                        th:text="${#temporals.format(business.createdAt,'dd.MM.yyyy')}">
                </strong>

            </p>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="modal fade"
     id="rejectModal"
     tabindex="-1">


    <div class="modal-dialog">


        <div class="modal-content">


            <form method="post"
                  th:action="@{/admin/business/{uuid}/reject(uuid=${business.uuid})}">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Respinge serviciul
                    </h5>

                    <button class="btn-close"
                            data-bs-dismiss="modal"
                            type="button">
                    </button>

                </div>


                <div class="modal-body">


                    <label class="form-label">

                        Motivul respingerii

                    </label>


                    <textarea class="form-control"
                              name="reason"
                              required
                              rows="4"></textarea>


                </div>


                <div class="modal-footer">


                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            type="button">
                        Anulează
                    </button>


                    <button class="btn btn-danger"
                            type="submit">

                        Respinge

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Gallery image preview -->
<div aria-hidden="true"
     aria-labelledby="galleryImagePreviewTitle"
     class="modal fade"
     id="galleryImagePreviewModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="galleryImagePreviewTitle">
                    Previzualizare imagine
                </h5>

                <button aria-label="Închide"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        type="button">
                </button>
            </div>

            <div class="modal-body text-center">
                <img alt="Imagine galerie mărită"
                     class="img-fluid rounded"
                     id="galleryImagePreview"
                     style="max-height: 75vh; object-fit: contain;">
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const modalElement =
            document.getElementById("galleryImagePreviewModal");

        const previewImage =
            document.getElementById("galleryImagePreview");

        modalElement.addEventListener("show.bs.modal", function (event) {
            const trigger = event.relatedTarget;

            previewImage.src = trigger?.dataset.imageSrc || "";
        });

        modalElement.addEventListener("hidden.bs.modal", function () {
            previewImage.removeAttribute("src");
        });

        document.querySelectorAll("[data-gallery-image-preview]").forEach(function (image) {
            image.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();

                    bootstrap.Modal
                        .getOrCreateInstance(modalElement)
                        .show(image);
                }
            });
        });
    });
</script>

<!--Show more images script-->
<script>
    function showMoreImages() {

        const hiddenImages =
            document.querySelectorAll('.gallery-extra-image');

        hiddenImages.forEach(image => {
            image.style.display = 'block';
        });

        const button =
            document.getElementById('showMoreImagesBtn');

        if (button) {
            button.style.display = 'none';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/video-fullscreen.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</body>
</html>
