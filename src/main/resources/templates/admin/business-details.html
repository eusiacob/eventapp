<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${business.name}"></title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <a class="btn btn-outline-secondary mb-3"
       th:href="@{/admin/businesses}">

        <i class="bi bi-arrow-left"></i>

        Înapoi la moderare servicii

    </a>

    <div class="alert alert-success" style="padding: 0.5em" th:if="${param.success}">
        Serviciul a fost aprobat!
    </div>

    <div class="alert alert-danger" style="padding: 0.5em" th:if="${param.rejected}">
        Serviciul a fost respins!
    </div>

    <div class="card shadow-sm border-0 rounded-4">

        <img class="card-img-top"
             style="height:350px; object-fit:cover;"
             th:src="@{${business.imagePath}}">

        <div class="row mt-4">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0 rounded-4 mb-4">

                    <div class="card-body">

                        <h4 class="mb-3">
                            Descriere
                        </h4>

                        <p th:text="${business.description}">
                        </p>

                        <hr>

                        <div class="row gy-3">

                            <div class="col-md-6">

                                <strong>Telefon</strong>

                                <div th:text="${business.phone}"></div>

                            </div>

                            <div class="col-md-6">

                                <strong>Email</strong>

                                <div th:text="${business.email}"></div>

                            </div>

                            <div class="col-md-6">

                                <strong>Website</strong>

                                <div>

                                    <a target="_blank"
                                       th:href="${business.website}"
                                       th:text="${business.website}">
                                    </a>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <strong>Oraș</strong>

                                <div th:text="${business.city}"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="card shadow-sm border-0 rounded-4 sticky-top"
                     style="top:90px;">

                    <div class="card-body">

                        <h5 class="mb-4">
                            Moderare
                        </h5>

                        <div class="mb-3">

                            <strong>Status</strong>

                            <div th:text="${business.status}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <strong>Owner</strong>

                            <div th:text="${business.user.firstName + ' ' + business.user.lastName}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <strong>Email owner</strong>

                            <div th:text="${business.user.email}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <strong>Creat la</strong>

                            <div th:text="${#temporals.format(business.createdAt,'dd.MM.yyyy')}">
                            </div>

                        </div>

                        <hr>

                        <div class="d-flex gap-2">

                            <form th:if="${business.status.name() != 'APPROVED'}"
                                  th:action="@{/admin/business/{uuid}/approve(uuid=${business.uuid})}"
                                  method="post">

                                <button class="btn btn-success">
                                    <i class="bi bi-check-circle"></i>
                                    Aprobă serviciul
                                </button>

                            </form>


                            <button th:if="${business.status.name() != 'REJECTED'}"
                                    class="btn btn-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#rejectModal">

                                <i class="bi bi-x-circle"></i>
                                Respinge serviciul

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-start">

                <div>

                    <h2 class="fw-bold"
                        th:text="${business.name}">
                    </h2>

                    <p class="text-muted mb-0">

                        <span th:text="${business.category.displayName}"></span>

                        •

                        <span th:text="${business.city}"></span>

                    </p>

                </div>

                <span class="badge fs-6"
                      th:classappend="
                            ${business.status.name() == 'PENDING'} ? ' bg-warning text-dark' :
                            (${business.status.name() == 'APPROVED'} ? ' bg-success' : ' bg-danger')"
                      th:text="${business.status}">
                </span>

            </div>

            <hr>

            <p class="text-muted">

                Trimis pe

                <strong
                        th:text="${#temporals.format(business.createdAt,'dd.MM.yyyy')}">
                </strong>

            </p>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="modal fade"
     id="rejectModal"
     tabindex="-1">


    <div class="modal-dialog">


        <div class="modal-content">


            <form method="post"
                  th:action="@{/admin/business/{uuid}/reject(uuid=${business.uuid})}">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Respinge serviciul
                    </h5>

                    <button class="btn-close"
                            data-bs-dismiss="modal"
                            type="button">
                    </button>

                </div>


                <div class="modal-body">


                    <label class="form-label">

                        Motivul respingerii

                    </label>


                    <textarea class="form-control"
                              name="reason"
                              required
                              rows="4"></textarea>


                </div>


                <div class="modal-footer">


                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            type="button">
                        Anulează
                    </button>


                    <button class="btn btn-danger"
                            type="submit">

                        Respinge

                    </button>

                </div>

            </form>

        </div>

    </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
