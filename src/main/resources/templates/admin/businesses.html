<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2 class="fw-bold mb-4 text-dark">
        Business-uri în așteptare
    </h2>

    <div class="table-responsive">
        <table class="table align-middle">

            <thead>
            <tr>
                <th></th>
                <th>Nume</th>
                <th>Categorie</th>
                <th>Județ</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="business : ${businesses}">
                <td>
                    <img style="width:70px;height:70px;object-fit:cover;border-radius:12px;"
                         th:src="@{${business.imagePath}}">
                </td>

                <td>
                    <strong th:text="${business.name}"></strong>
                </td>

                <td th:text="${business.category.displayName}"></td>

                <td th:text="${business.city}"></td>

                <td>
                    <span class="badge bg-warning">
                        Pending
                    </span>
                </td>

                <td>
                    <a class="btn btn-dark"
                       th:href="@{/admin/business/{uuid}(uuid=${business.uuid})}">
                        Vezi
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
