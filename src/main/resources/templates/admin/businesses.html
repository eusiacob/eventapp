<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Servicii</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">


    <h4 class="fw-bold mb-4 text-dark">

        Servicii

    </h4>


    <div class="btn-group mb-4">


        <a class="btn btn-dark"
           th:href="@{/admin/businesses}">

            Toate

        </a>


        <a class="btn btn-outline-warning"
           th:href="@{/admin/businesses(status='PENDING')}">

            În așteptare

        </a>


        <a class="btn btn-outline-success text-center"
           th:href="@{/admin/businesses(status='APPROVED')}">

            Aprobate

        </a>


        <a class="btn btn-outline-danger"
           th:href="@{/admin/businesses(status='REJECTED')}">

            Refuzate

        </a>


    </div>


</div>

<div class="row g-4 px-4">

    <div class="col-lg-4 col-md-6"
         th:each="business : ${businesses}">


        <a th:href="@{/admin/business/{uuid}(uuid=${business.uuid})}"
           class="admin-business-card-link">


            <div class="card shadow-sm border-0 rounded-4 h-100">


                <!-- Cover -->

                <img th:src="@{${business.imagePath}}"
                     class="card-img-top rounded-top-4"
                     style="height:220px; object-fit:cover;">


                <div class="card-body">


                    <div class="d-flex justify-content-between align-items-start">


                        <h5 class="fw-bold mb-2"
                            th:text="${business.name}">
                        </h5>


                        <span class="badge"
                              th:classappend="
                              ${business.status.name() == 'PENDING'} ? ' bg-warning text-dark' :
                              (${business.status.name() == 'APPROVED'} ? ' bg-success' :
                              ' bg-danger')"
                              th:text="${business.status}">
                        </span>


                    </div>


                    <p class="text-muted mb-1">

                        <i class="bi bi-tag"></i>

                        <span th:text="${business.category}">
                        </span>

                    </p>


                    <p class="text-muted mb-1">

                        <i class="bi bi-geo-alt"></i>

                        <span th:text="${business.city}">
                        </span>

                    </p>


                    <small class="text-secondary">

                        Creat:

                        <span th:text="${#temporals.format(business.createdAt,'dd.MM.yyyy')}">
                        </span>

                    </small>

                </div>

            </div>

        </a>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
