<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Servicii</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="d-flex flex-wrap gap-3 mb-4">

        <a class="admin-filter-btn all"
           th:classappend="${selectedStatus == null} ? ' active'"
           th:href="@{/admin/businesses(search=${search}, size=${size}, sort=${sort})}">
            Toate
        </a>


        <a class="admin-filter-btn pending"
           th:classappend="${selectedStatus?.name() == 'PENDING'} ? ' active'"
           th:href="@{/admin/businesses(status='PENDING', search=${search}, size=${size}, sort=${sort})}">
            În așteptare
        </a>


        <a class="admin-filter-btn approved"
           th:classappend="${selectedStatus?.name() == 'APPROVED'} ? ' active'"
           th:href="@{/admin/businesses(status='APPROVED', search=${search}, size=${size}, sort=${sort})}">
            Aprobate
        </a>


        <a class="admin-filter-btn rejected"
           th:classappend="${selectedStatus?.name() == 'REJECTED'} ? ' active'"
           th:href="@{/admin/businesses(status='REJECTED', search=${search}, size=${size}, sort=${sort})}">
            Refuzate
        </a>

    </div>

    <form class="row g-2 align-items-end mb-4"
          method="get"
          th:action="@{/admin/businesses}">
        <input name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}" type="hidden">
        <input name="page" type="hidden" value="0">
        <div class="col-12 col-md-7 col-lg-5">
            <label class="form-label text-dark" for="businessSearch">Caută servicii</label>
            <input class="form-control"
                   id="businessSearch"
                   name="search"
                   placeholder="Numele serviciului sau utilizatorul"
                   th:value="${search}"
                   type="search">
        </div>
        <div class="col-12 col-md-auto d-flex gap-2">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-search me-1"></i>Caută
            </button>
            <a class="btn btn-outline-secondary"
               th:href="@{/admin/businesses(status=${selectedStatus}, size=${size}, sort=${sort})}">
                Reset
            </a>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label text-dark" for="businessSort">Sortează</label>
            <select class="form-select" id="businessSort" name="sort" onchange="this.form.submit()">
                <option value="newest" th:selected="${sort == 'newest'}">Cele mai noi</option>
                <option value="oldest" th:selected="${sort == 'oldest'}">Cele mai vechi</option>
                <option value="nameAsc" th:selected="${sort == 'nameAsc'}">Nume A–Z</option>
                <option value="nameDesc" th:selected="${sort == 'nameDesc'}">Nume Z–A</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label text-dark" for="businessSize">Pe pagină</label>
            <select class="form-select" id="businessSize" name="size" onchange="this.form.submit()">
                <option value="5" th:selected="${size == 5}">5</option>
                <option value="10" th:selected="${size == 10}">10</option>
                <option value="20" th:selected="${size == 20}">20</option>
            </select>
        </div>
    </form>

    <p class="small text-muted mb-2" th:if="${businesses.totalElements > 0}"
       th:text="|Se afișează ${businesses.numberOfElements} din ${businesses.totalElements} servicii|"></p>

    <div class="admin-business-list" th:if="${not businesses.isEmpty()}">
        <a class="admin-business-row"
           th:each="business : ${businesses}"
           th:href="@{/admin/business/{uuid}(uuid=${business.slug})}">
            <img class="admin-business-row-image"
                 decoding="async"
                 height="480"
                 loading="lazy"
                 th:alt="|Imagine pentru ${business.name}|"
                 th:src="@{${business.coverImagePath}}"
                 width="640">

            <div class="admin-business-row-main">
                <h2 class="admin-business-row-title" th:text="${business.name}"></h2>
                <div class="admin-business-row-meta">
                    <span>
                        <i aria-hidden="true" class="bi bi-tag"></i>
                        <span th:text="${business.category}"></span>
                    </span>
                    <span>
                        <i aria-hidden="true" class="bi bi-geo-alt"></i>
                        <span th:text="${business.city}"></span>
                    </span>
                </div>
            </div>

            <div class="admin-business-row-footer">
                <span class="admin-status-badge admin-business-row-status"
                      th:classappend="${business.status.name() == 'PENDING'} ? ' bg-warning text-dark' : (${business.status.name() == 'APPROVED'} ? ' bg-success' : ' bg-danger')"
                      th:text="${business.status.statusDisplayName}"></span>

                <small class="admin-business-row-created">
                    <span>Creat:</span>
                    <time th:datetime="${#temporals.format(business.createdAt, 'yyyy-MM-dd')}"
                          th:text="${#temporals.format(business.createdAt, 'dd.MM.yyyy')}"></time>
                </small>
            </div>

            <i aria-hidden="true" class="bi bi-chevron-right admin-business-row-chevron"></i>
        </a>
    </div>

    <nav aria-label="Paginare servicii" class="mt-4" th:if="${businesses.totalPages > 1}">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${businesses.first} ? ' disabled'"><a class="page-link" th:href="@{/admin/businesses(status=${selectedStatus}, search=${search}, size=${size}, sort=${sort}, page=${businesses.number - 1})}">Anterior</a></li>
            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, businesses.totalPages - 1)}" th:classappend="${pageNumber == businesses.number} ? ' active'"><a class="page-link" th:text="${pageNumber + 1}" th:href="@{/admin/businesses(status=${selectedStatus}, search=${search}, size=${size}, sort=${sort}, page=${pageNumber})}"></a></li>
            <li class="page-item" th:classappend="${businesses.last} ? ' disabled'"><a class="page-link" th:href="@{/admin/businesses(status=${selectedStatus}, search=${search}, size=${size}, sort=${sort}, page=${businesses.number + 1})}">Următoarea</a></li>
        </ul>
    </nav>

    <!-- NU EXISTA SERVICII -->
    <div class="text-center py-5"
         th:if="${businesses.isEmpty()}">

        <i class="bi bi-buildings-fill"
           style="font-size:60px;color:#ced4da;"></i>

        <h5 class="mt-3 text-dark">

            Nu există servicii.

        </h5>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
