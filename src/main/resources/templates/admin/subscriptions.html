<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Abonamente</title>


    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h5 class="fw-bold mb-3 text-dark">

        Abonamente

    </h5>

    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle table-hover">

                    <thead>

                    <tr>

                        <th>Utilizator</th>

                        <th>Email</th>

                        <th>Plan</th>

                        <th>Status</th>

                        <th>Început</th>

                        <th>Expirare</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr class="clickable-row"
                        th:data-href="@{/admin/user/{id}(id=${subscription.user.id})}"
                        th:each="subscription : ${subscriptions}">

                        <td th:text="${subscription.user.firstName + ' ' + subscription.user.lastName}">
                        </td>

                        <td th:text="${subscription.user.email}">
                        </td>

                        <td>

                            <span class="badge bg-dark"
                                  th:text="${subscription.plan}">
                            </span>

                        </td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${subscription.status.name() == 'ACTIVE'}">

                                Activ

                            </span>

                            <span class="badge bg-danger"
                                  th:if="${subscription.status.name() == 'EXPIRED'}">

                                Expirat

                            </span>

                            <span class="badge bg-secondary"
                                  th:if="${subscription.status.name() == 'CANCELLED'}">

                                Anulat

                            </span>

                        </td>

                        <td th:text="${#temporals.format(subscription.startDate,'dd.MM.yyyy')}">
                        </td>

                        <td th:text="${#temporals.format(subscription.endDate,'dd.MM.yyyy')}">
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    document.querySelectorAll(".clickable-row")
        .forEach(row => {

            row.addEventListener("click", () => {

                window.location.href = row.dataset.href;

            });

        });

</script>

</body>

</html>
