<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Abonamente</title>

    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="d-flex gap-2 mb-4 flex-wrap">

        <a class="admin-filter-btn all"
           th:classappend="${currentStatus == null} ? ' active'"
           th:href="@{/admin/subscriptions}">

            Toate

        </a>

        <a class="admin-filter-btn approved"
           th:classappend="${currentStatus == 'ACTIVE'} ?' active'"
           th:href="@{/admin/subscriptions(status='ACTIVE')}">

            Active

        </a>

        <a class="admin-filter-btn pending"
           th:classappend="${currentStatus == 'PENDING'} ?' active'"
           th:href="@{/admin/subscriptions(status='PENDING')}">

            În așteptare

        </a>

        <a class="admin-filter-btn rejected"
           th:classappend="${currentStatus == 'EXPIRED'} ? 'active'"
           th:href="@{/admin/subscriptions(status='EXPIRED')}">

            Expirate

        </a>

        <a class="admin-filter-btn all"
           th:classappend="${currentStatus == 'CANCELLED'} ? ' active'"
           th:href="@{/admin/subscriptions(status='CANCELLED')}">

            Anulate

        </a>

    </div>

    <span class="badge bg-dark rounded-pill px-3 py-2 mb-3">

        <i class="bi bi-credit-card me-1"></i>

        <span class="text-white" th:text="${subscriptions.size()}"></span>

        <span class="text-white" th:text="${subscriptions.size() == 1 ? ' abonament' : ' abonamente'}"></span>

    </span>

    <div class="card border-0 shadow-sm rounded-4">

        <!--SUBSCRIPTIONS-->
        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>

                        <th>
                            Utilizator
                        </th>

                        <th>
                            Tip
                        </th>

                        <th>
                            Durată
                        </th>

                        <th>
                            Preț
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Început
                        </th>

                        <th>
                            Sfârșit
                        </th>

                        <th>
                            Actiuni
                        </th>


                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="subscription : ${subscriptions}">

                        <td
                                th:text="${subscription.user.email}">
                        </td>


                        <td
                                th:text="${subscription.plan.type}">
                        </td>


                        <td
                                th:text="${subscription.plan.duration.getDisplayName()}">

                        </td>


                        <td>

                            <span
                                    th:text="${subscription.price + ' lei'}">
                            </span>

                        </td>


                        <td>

                            <span class="badge"

                                  th:classappend="
                            ${subscription.status.name() == 'ACTIVE'} ? 'bg-success' :
                            (${subscription.status.name() == 'EXPIRED' || subscription.status.name() =='CANCELLED'} ? 'bg-danger' :
                            'bg-warning text-dark')"

                                  th:text="${subscription.status.statusDisplayName}">
                            </span>

                        </td>

                        <td
                                th:text="${#temporals.format(subscription.startDate,'dd.MM.yyyy')}">
                        </td>


                        <td
                                th:text="${#temporals.format(subscription.endDate,'dd.MM.yyyy')}">
                        </td>

                        <td>

                            <form
                                    class="d-inline"
                                    method="post"
                                    th:action="@{/admin/user/{id}/subscription/activate(id=${subscription.id})}"
                                    th:if="${subscription.status.name() == 'PENDING'}">

                                <button
                                        class="btn btn-sm btn-success"
                                        type="submit">

                                    Activează

                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- NU EXISTA ABONAMENTE CREATE -->
    <div class="text-center py-5"
         th:if="${subscriptions.isEmpty()}">

        <i class="bi bi-credit-card-fill"
           style="font-size:60px;color:#ced4da;"></i>

        <h5 class="mt-3 text-dark">

            Nu există abonamente create.

        </h5>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    document.querySelectorAll(".clickable-row")
        .forEach(row => {

            row.addEventListener("click", () => {

                window.location.href = row.dataset.href;

            });

        });

</script>

</body>

</html>
