<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Planuri de abonament</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="min-height: 100vh">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        Editează planul
                    </h2>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Tip abonament
                        </label>

                        <input
                                class="form-control"
                                disabled
                                th:value="${plan.type}"
                                type="text">

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Durată
                        </label>

                        <input
                                class="form-control"
                                disabled
                                th:value="${plan.duration.getDisplayName()}">

                    </div>

                    <form
                            method="post"
                            th:action="@{/admin/subscription-plans/{id}/edit(id=${plan.id})}">

                        <div class="mb-4">

                            <label
                                    class="form-label fw-semibold"
                                    for="price">

                                Preț (lei)

                            </label>

                            <input
                                    class="form-control"
                                    id="price"
                                    min="0"
                                    name="price"
                                    required
                                    step="0.01"
                                    th:value="${plan.price}"
                                    type="number">

                        </div>

                        <div class="form-check mb-4">

                            <input
                                    class="form-check-input"
                                    id="active"
                                    name="active"
                                    th:checked="${plan.active}"
                                    type="checkbox">

                            <label
                                    class="form-check-label"
                                    for="active">

                                Plan activ

                            </label>

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                    class="btn btn-primary"
                                    type="submit">

                                Salvează

                            </button>

                            <a class="btn btn-outline-secondary"
                                    th:href="@{/admin/plans}">
                                Anulează

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    document.querySelectorAll(".clickable-row")
        .forEach(row => {

            row.addEventListener("click", () => {

                window.location.href = row.dataset.href;

            });

        });

</script>

</body>

</html>
