<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Documente legale</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-bg">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="min-height: 100vh">
    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage != null}">
        <span th:text="${successMessage}"></span>
        <button aria-label="Închide" class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-start gap-3 mb-4">
                <i class="bi bi-file-earmark-text-fill fs-2"></i>
                <div>
                    <h1 class="h4 fw-bold mb-1">Documente legale</h1>
                    <p class="text-muted mb-0">Modifică textul, versiunea și data afișată public.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12 col-md-6" th:each="document : ${documents}">
                    <div class="border rounded-3 p-4 h-100">
                        <div class="d-flex justify-content-between gap-3 mb-3">
                            <div>
                                <h2 class="h5 fw-bold mb-1"
                                    th:text="${document.type.name() == 'PRIVACY_POLICY' ? 'Politica de confidențialitate' : 'Termeni și condiții'}"></h2>
                                <p class="text-muted small mb-0">
                                    Versiunea<span th:text="${document.version}"></span> ·
                                    actualizată la <span th:text="${#temporals.format(document.lastUpdated, 'dd.MM.yyyy')}"></span>
                                </p>
                            </div>
                            <i class="bi bi-shield-lock" th:if="${document.type.name() == 'PRIVACY_POLICY'}"></i>
                            <i class="bi bi-file-earmark-text" th:if="${document.type.name() == 'TERMS_AND_CONDITIONS'}"></i>
                        </div>
                        <a class="btn btn-outline-dark w-100"
                           th:href="@{/admin/legal-documents/{type}(type=${document.type})}">
                            Modifică documentul
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
