<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Moderare utilizatori</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ADMIN PAGE -->
<div class="container py-4" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!--    FILTRE-->
    <div class="d-flex flex-wrap gap-3 mb-3">

        <a class="admin-filter-btn all"
           th:classappend="${selectedRole == null} ? ' active'"
           th:href="@{/admin/users(search=${search})}">

            Toți
        </a>

        <a class="admin-filter-btn bg-primary text-white"
           th:classappend="${selectedRole?.name() == 'USER'} ? ' active'"
           th:href="@{/admin/users(role='USER', search=${search})}">

            USER
        </a>

        <a class="admin-filter-btn bg-success text-white"
           th:classappend="${selectedRole?.name() == 'BUSINESS'} ? ' active'"
           th:href="@{/admin/users(role='BUSINESS', search=${search})}">

            BUSINESS
        </a>

        <a class="admin-filter-btn bg-admin text-white"
           th:classappend="${selectedRole?.name() == 'ADMIN'} ? ' active'"
           th:href="@{/admin/users(role='ADMIN', search=${search})}">

            ADMIN

        </a>

    </div>

    <form class="row g-2 align-items-end mb-3"
          method="get"
          th:action="@{/admin/users}">
        <input name="role" th:if="${selectedRole != null}" th:value="${selectedRole}" type="hidden">
        <div class="col-12 col-md-7 col-lg-5">
            <label class="form-label text-dark" for="userSearch">Caută utilizatori</label>
            <input class="form-control"
                   id="userSearch"
                   name="search"
                   placeholder="Numele utilizatorului sau emailul"
                   th:value="${search}"
                   type="search">
        </div>
        <div class="col-12 col-md-auto d-flex gap-2">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-search me-1"></i>Caută
            </button>
            <a class="btn btn-outline-secondary"
               th:href="@{/admin/users(role=${selectedRole})}">
                Reset
            </a>
        </div>
    </form>

    <!--    LISTA-->
    <span class="text-muted"
          th:text="${users.size()}">
        </span>

    <span class="text-muted"
          th:text="${users.size()} == 1 ? ' utilizator' : ' utilizatori'">
        </span>

    <div class="admin-entity-list admin-user-list" th:if="${not users.isEmpty()}">
        <a class="admin-entity-row admin-user-row"
           th:each="userDto : ${users}"
           th:href="@{/admin/user/{id}(id=${userDto.user.id})}">
            <div class="admin-entity-main admin-user-main">
                <h2 class="admin-entity-title"
                    th:text="${userDto.user.firstName + ' ' + userDto.user.lastName}"></h2>
                <div class="admin-user-email-line">
                    <span class="admin-user-email" th:text="${userDto.user.email}"></span>
                    <span class="badge bg-success-subtle text-success border border-success-subtle"
                          th:if="${userDto.user.emailVerified}">
                        <i aria-hidden="true" class="bi bi-patch-check-fill me-1"></i>Verificat
                    </span>
                    <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle"
                          th:if="${!userDto.user.emailVerified}">
                        <i aria-hidden="true" class="bi bi-exclamation-triangle-fill me-1"></i>Neverificat
                    </span>
                </div>
            </div>

            <div aria-label="Activitatea utilizatorului" class="admin-user-metrics">
                <span><strong th:text="${userDto.user.businessProfiles.size()}"></strong><small>servicii</small></span>
                <span><strong th:text="${userDto.user.favoriteBusinesses.size()}"></strong><small>favorite</small></span>
                <span><strong th:text="${userDto.reviewCount}"></strong><small>recenzii</small></span>
            </div>

            <div class="admin-entity-footer admin-user-footer">
                <span class="badge admin-user-role"
                      th:classappend="${userDto.user.role.name == 'ADMIN'} ? 'bg-admin' : (${userDto.user.role.name == 'BUSINESS'} ? 'bg-success' : 'bg-primary')"
                      th:text="${userDto.user.role.name}"></span>

                <span class="badge rounded-pill bg-success-subtle text-success-emphasis"
                      th:if="${userDto.user.enabled}">
                    <i aria-hidden="true" class="bi bi-check-circle me-1"></i>Activ
                </span>
                <span class="badge rounded-pill bg-danger-subtle text-danger-emphasis"
                      th:if="${!userDto.user.enabled and userDto.user.accountStatusReason.name() == 'MANUAL'}"
                      title="Suspendat de administrator">
                    <i aria-hidden="true" class="bi bi-person-x me-1"></i>Suspendat
                </span>
                <span class="badge rounded-pill bg-warning-subtle text-warning-emphasis"
                      th:if="${!userDto.user.enabled and userDto.user.accountStatusReason.name() == 'INACTIVITY'}"
                      title="Dezactivat automat după 6 luni fără activitate">
                    <i aria-hidden="true" class="bi bi-clock-history me-1"></i>Inactiv
                </span>

                <time class="admin-entity-date"
                      th:datetime="${#temporals.format(userDto.user.createdAt, 'yyyy-MM-dd')}"
                      th:text="${#temporals.format(userDto.user.createdAt, 'dd.MM.yyyy')}"></time>
            </div>

            <i aria-hidden="true" class="bi bi-chevron-right admin-entity-chevron"></i>
        </a>
    </div>

    <!-- NU EXISTA UTILIZATORI -->
    <div class="text-center py-5"
         th:if="${users.isEmpty()}">

        <i class="bi bi-people-fill"
           style="font-size:60px;color:#ced4da;"></i>

        <h5 class="mt-3 text-dark">

            Nu există utilizatori.

        </h5>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
