<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Moderare utilizatori</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ADMIN PAGE -->
<div class="container py-4">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!--    FILTRE-->
    <div class="d-flex flex-wrap gap-3 mb-3">

        <a class="admin-filter-btn all"
           th:classappend="${selectedRole == null} ? ' active'"
           th:href="@{/admin/users}">

            Toți
        </a>

        <a class="admin-filter-btn bg-primary text-white"
           th:classappend="${selectedRole?.name() == 'USER'} ? ' active'"
           th:href="@{/admin/users(role='USER')}">

            USER
        </a>

        <a class="admin-filter-btn bg-success text-white"
           th:classappend="${selectedRole?.name() == 'BUSINESS'} ? ' active'"
           th:href="@{/admin/users(role='BUSINESS')}">

            BUSINESS
        </a>

        <a class="admin-filter-btn bg-dark text-white"
           th:classappend="${selectedRole?.name() == 'ADMIN'} ? ' active'"
           th:href="@{/admin/users(role='ADMIN')}">

            ADMIN

        </a>

    </div>

    <!--    LISTA-->

    <span class="text-muted"
          th:text="${users.size()}">
        </span>

    <span class="text-muted"
          th:text="${users.size()} == 1 ? ' utilizator' : ' utilizatori'">
        </span>

    <div class="card border-0 shadow-sm rounded-4 mt-2">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle table-hover">

                    <thead>

                    <tr>

                        <th>Utilizator</th>

                        <th>Email</th>

                        <th>Rol</th>

                        <th>Servicii</th>

                        <th>Favorite</th>

                        <th>Recenzii</th>

                        <th>Data înregistrării</th>

                        <th>Status cont</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr class="clickable-row"

                        th:data-href="@{/admin/user/{id}(id=${userDto.user.id})}"

                        th:each="userDto : ${users}">

                        <td class="fw-semibold"
                            th:text="${userDto.user.firstName} + ' ' + ${userDto.user.lastName}">
                        </td>

                        <td
                                th:text="${userDto.user.email}">
                        </td>

                        <td>

                <span class="badge"

                      th:classappend="
                            ${userDto.user.role.name == 'ADMIN'} ? 'bg-dark' :
                            (${userDto.user.role.name == 'BUSINESS'} ? 'bg-success' : 'bg-primary')"

                      th:text="${userDto.user.role.name}">

                </span>

                        </td>

                        <td
                                th:text="${userDto.user.businessProfiles.size()}">
                        </td>

                        <td
                                th:text="${userDto.user.favoriteBusinesses.size()}">

                        </td>

                        <td
                                th:text="${userDto.reviewCount}">

                        </td>

                        <td
                                th:text="${#temporals.format(userDto.user.createdAt,'dd.MM.yyyy')}">
                        </td>

                        <td>
                            <!-- Cont activ -->
                            <span class="badge rounded-pill bg-success-subtle text-success-emphasis"
                                  th:if="${userDto.user.enabled}">

                                <i class="bi bi-check-circle me-1"></i>
                                Activ

                            </span>

                            <!-- Suspendat manual -->
                            <span class="badge rounded-pill bg-danger-subtle text-danger-emphasis"
                                  th:if="${!userDto.user.enabled and userDto.user.accountStatusReason.name() == 'MANUAL'}"
                                  title="Suspendat de administrator">

                                <i class="bi bi-person-x me-1"></i>
                                Suspendat

                            </span>

                            <!-- Dezactivat pentru inactivitate -->
                            <span class="badge rounded-pill bg-warning-subtle text-warning-emphasis"
                                  th:if="${!userDto.user.enabled and userDto.user.accountStatusReason.name() == 'INACTIVITY'}"
                                  title="Dezactivat automat după 6 luni fără activitate">

                                <i class="bi bi-clock-history me-1"></i>
                                Inactiv

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!--CLICKABLE USER ROW-->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        document.querySelectorAll(".clickable-row").forEach(function (row) {

            row.addEventListener("click", function () {

                window.location.href = this.dataset.href;

            });

        });

    });
</script>

</body>
</html>
