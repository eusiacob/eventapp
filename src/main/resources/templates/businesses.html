<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Home</title>
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-3 fluid px-3">

    <!--CATEGORIES-->
    <div class="mb-2">

        <div th:replace="~{fragments/carousel-header :: header(
        'Categorii',
        'categoryCarousel')}">
        </div>

        <p class="text-muted mb-0">
            Alege o categorie și explorează serviciile disponibile
        </p>
    </div>

    <div class="category-carousel" id="categoryCarousel">

        <a class="category-chip carousel-card"
           th:each="category : ${categories}"
           th:href="@{/businesses/category/{category}(category=${category})}">

            <i class="bi"
               th:classappend="' ' + ${category.icon}"></i>

            <span th:text="${category.displayName}"></span>

        </a>

    </div>

    <!--    Premium section-->
    <section class="premium-section mt-4" th:if="${not #lists.isEmpty(premiumBusinesses)}">

        <div th:replace="~{fragments/carousel-header :: header(
        'Servicii premium',
        'premiumCarousel')}">
        </div>

        <div class="category-carousel" id="premiumCarousel">


            <div class="premium-card carousel-card"
                 th:each="b : ${premiumBusinesses}"
                 th:data-url="@{/business/{uuid}(uuid=${b.uuid})}"
                 onclick="window.location=this.dataset.url">

                <!-- badge -->
                <span class="premium-badge">PREMIUM</span>

                <!-- imagine -->
                <div class="premium-image"
                     th:style="|background-image: url('${b.imagePath}')|">
                </div>

                <!-- text -->
                <div class="premium-info">

                    <h5 class="premium-title"
                        th:text="${b.name}">
                    </h5>

                    <p class="premium-county"
                       th:text="${b.city}">
                    </p>

                </div>

            </div>

        </div>

    </section>

    <!--    Top favorite section-->
    <section class="favorite-section mt-4" th:if="${not #lists.isEmpty(mostFavoriteBusinesses)}">

        <div th:replace="~{fragments/carousel-header :: header(
        'Top servicii favorite',
        'favoriteCarousel')}">
        </div>

        <div class="category-carousel" id="favoriteCarousel">

            <div class="premium-card carousel-card"
                 th:each="b : ${mostFavoriteBusinesses}"
                 th:data-url="@{/business/{uuid}(uuid=${b.uuid})}"
                 onclick="window.location=this.dataset.url">

                <span class="favorite-badge">TOP FAVORITE <span class="favorite-heart-badge">♥</span></span>

                <div class="premium-image"
                     th:style="|background-image: url('${b.imagePath}')|">
                </div>

                <div class="premium-info">

                    <h5 class="premium-title"
                        th:text="${b.name}"></h5>

                    <p class="premium-county"
                       th:text="${b.city}"></p>

                </div>

            </div>

        </div>

    </section>

    <!--    Top-rated section-->
    <section class="top-rated-section mt-4" th:if="${not #lists.isEmpty(topRatedBusinesses)}">

        <div th:replace="~{fragments/carousel-header :: header(
        'Top servicii apreciate',
        'topRatedCarousel')}">
        </div>

        <div class="category-carousel" id="topRatedCarousel">

            <div class="premium-card carousel-card"
                 th:each="b : ${topRatedBusinesses}"
                 th:data-url="@{/business/{uuid}(uuid=${b.uuid})}"
                 onclick="window.location=this.dataset.url">

                <span class="top-rating-badge">TOP APRECIATE <span class="top-star-badge">★</span></span>

                <div class="premium-image"
                     th:style="|background-image: url('${b.imagePath}')|">
                </div>

                <div class="premium-info">

                    <h5 class="premium-title"
                        th:text="${b.name}"></h5>

                    <p class="premium-county"
                       th:text="${b.city}"></p>

                    <span class="fs-6 text-warning">★</span>
                    <span class="premium-county" th:text="${#numbers.formatDecimal(b.averageRating, 1, 1)}"></span>

                </div>


            </div>

        </div>

    </section>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!--NAVBAR COLAPSE-->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const navLinks = document.querySelectorAll(".navbar-collapse .nav-link");
        const navbarCollapse = document.querySelector(".navbar-collapse");

        navLinks.forEach(link => {
            link.addEventListener("click", () => {
                if (navbarCollapse.classList.contains("show")) {
                    const bsCollapse = new bootstrap.Collapse(navbarCollapse);
                    bsCollapse.hide();
                }
            });
        });
    });
</script>

<!--CAROUSEL ARROWS SCROLL-->
<script th:src="@{/js/carousel.js}"></script>

</body>
</html>
