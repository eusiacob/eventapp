<!DOCTYPE html>
<html lang="ro"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="app-navbar-wrapper"
     th:fragment="navbar">

    <!-- DESKTOP NAVBAR -->
    <div class="desktop-navbar navbar navbar-expand-lg navbar-light bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand mevent-brand" href="/businesses">
                <img alt="M-Event"
                     class="mevent-logo"
                     th:src="@{/images/logo_transparent.png}">
            </a>

            <ul class="navbar-nav ms-auto align-items-center gap-2">

                <!--EXPLORE-->
                <li class="nav-item">
                    <a class="nav-link" href="/businesses">
                        Explorează
                    </a>
                </li>

                <!--FAVORITES-->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link favorites-link" href="/favorites">
                        <span>Favorite</span>
                        <span class="favorite-icon-wrapper">
                            <span class="favorite-navbar-heart">♥</span>
                            <span class="favorite-exponent-count" id="favoriteCountBadge"
                                  th:text="${favoriteCount}">0</span>
                        </span>

                    </a>
                </li>

                <!--SUBSCRIPTIONS -- VA URMA -->
                <!--                <li class="nav-item" sec:authorize="isAuthenticated()">-->
                <!--                    <a class="nav-link"-->
                <!--                       th:href="@{/subscriptions}">-->
                <!--                        Abonamente-->
                <!--                    </a>-->

                <!--                </li>-->

                <!--NOTIFICATIONS DROPDOWN LIST-->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">

                    <a class="nav-link position-relative"
                       data-bs-toggle="dropdown"
                       href="#"
                       role="button">

                        <i class="bi bi-bell fs-5 notification-navbar-icon"></i>

                        <span class="notification-badge"
                              th:if="${notificationCount > 0}">
                            <span th:text="${notificationCount}">
                            </span>
                        </span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end notification-dropdown p-0">

                        <li th:if="${#lists.isEmpty(notifications)}">

                            <div class="navbar-notifications-empty">
                                <i class="bi bi-bell-slash"></i>
                                <p class="mb-0">Nu ai notificări noi.</p>
                            </div>

                        </li>

                        <li th:each="notification : ${notifications}">

                            <a class="navbar-notification-entry"
                               th:classappend="${notification.isRead ? '' : ' is-unread'}"
                               th:href="@{/notifications/{id}(id=${notification.id})}">

                                <i class="bi bi-bell"></i>

                                <span>
                                    <strong th:text="${notification.title}"></strong>
                                    <small th:text="${notification.message}"></small>
                                </span>

                            </a>

                        </li>

                    </ul>

                </li>

                <!--ACCOUNT DROPDOWN LIST-->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">

                    <a aria-expanded="false"
                       class="nav-link dropdown-toggle account-link"
                       data-bs-toggle="dropdown"
                       href="#"
                       id="accountDropdown"
                       role="button">
                        Contul meu
                    </a>

                    <ul aria-labelledby="accountDropdown"
                        class="dropdown-menu dropdown-menu-end shadow border-0">

                        <li sec:authorize="hasRole('BUSINESS')">
                            <a class="dropdown-item" href="/dashboard">
                                Serviciile mele
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/profile">
                                Profil
                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <form method="post" th:action="@{/logout}">
                                <button class="dropdown-item text-danger"
                                        type="submit">
                                    Ieși din cont
                                </button>
                            </form>
                        </li>

                    </ul>

                </li>

                <!--LOGIN-->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login">
                        Login
                    </a>
                </li>

                <!--REGISTER-->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-dark navbar-register-btn" href="/register">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>


    <!-- MOBILE BOTTOM NAVBAR -->
    <div class="mobile-bottom-nav">

        <a class="mobile-nav-item" href="/businesses">
            <i class="bi bi-search"></i>
            <span>Explorează</span>
        </a>

        <a class="mobile-nav-item mobile-favorite-item"
           href="/favorites"
           sec:authorize="isAuthenticated()">

    <span class="mobile-icon-badge-wrapper">
        <i class="bi bi-heart-fill"></i>

        <span class="mobile-favorite-badge"
              id="favoriteCountBadgeMobile"
              th:text="${favoriteCount}">
            0
        </span>
    </span>

            <span>Favorite</span>
        </a>

        <button aria-controls="mobileNotificationsPanel"
                aria-label="Notificări"
                class="mobile-nav-item mobile-nav-button mobile-notification-item"
                data-bs-target="#mobileNotificationsPanel"
                data-bs-toggle="offcanvas"
                sec:authorize="isAuthenticated()"
                type="button">

            <span class="mobile-icon-badge-wrapper">
                <i class="bi bi-bell notification-navbar-icon"></i>

                <span class="mobile-notification-badge"
                      th:if="${notificationCount > 0}"
                      th:text="${notificationCount}">
                    0
                </span>
            </span>

            <span>Alerte</span>
        </button>

        <a class="mobile-nav-item"
           href="/profile"
           sec:authorize="isAuthenticated()">

            <i class="bi bi-person"></i>
            <span>Profil</span>
        </a>

        <form class="mobile-nav-form"
              method="post"
              sec:authorize="isAuthenticated()"
              th:action="@{/logout}">

            <button class="mobile-nav-item mobile-nav-button" type="submit">
                <i class="bi bi-box-arrow-right"></i>
                <span>Ieși</span>
            </button>

        </form>

        <a class="mobile-nav-item"
           href="/login"
           sec:authorize="isAnonymous()">

            <i class="bi bi-box-arrow-in-right"></i>
            <span>Login</span>
        </a>

        <a class="mobile-nav-item"
           href="/register"
           sec:authorize="isAnonymous()">

            <i class="bi bi-person-plus"></i>
            <span>Register</span>
        </a>

    </div>

    <!-- MOBILE NOTIFICATIONS -->
    <div aria-labelledby="mobileNotificationsPanelTitle"
         class="offcanvas offcanvas-bottom mobile-notifications-panel"
         id="mobileNotificationsPanel"
         sec:authorize="isAuthenticated()"
         tabindex="-1">

        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="mobileNotificationsPanelTitle">
                Notificări
            </h5>

            <button aria-label="Închide"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    type="button">
            </button>
        </div>

        <div class="offcanvas-body p-0">
            <div class="navbar-notifications-empty"
                 th:if="${#lists.isEmpty(notifications)}">
                <i class="bi bi-bell-slash"></i>
                <p class="mb-0">Nu ai notificări noi.</p>
            </div>

            <div class="navbar-notification-list"
                 th:if="${!#lists.isEmpty(notifications)}">
                <a class="navbar-notification-entry"
                   th:classappend="${notification.isRead ? '' : ' is-unread'}"
                   th:each="notification : ${notifications}"
                   th:href="@{/notifications/{id}(id=${notification.id})}">

                    <i class="bi bi-bell"></i>

                    <span>
                        <strong th:text="${notification.title}"></strong>
                        <small th:text="${notification.message}"></small>
                    </span>
                </a>
            </div>
        </div>
    </div>

</nav>

</body>
</html>
