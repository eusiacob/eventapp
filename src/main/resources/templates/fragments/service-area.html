<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<body>
<fieldset class="mb-3 service-area-picker" th:fragment="picker">
    <legend class="form-label fs-6">Unde oferi serviciul?</legend>
    <p class="form-text mt-0">Selectează între 1 și 10 județe sau alege Toată țara.</p>
    <div class="form-check mb-2">
        <input class="form-check-input service-area-nationwide" th:field="*{nationwide}"
               type="checkbox">
        <label class="form-check-label fw-semibold" th:for="${#ids.prev('nationwide')}">Toată țara</label>
    </div>
    <details class="service-area-options"
             th:open="${#fields.hasErrors('serviceCounties') or #fields.hasErrors('serviceAreaValid')}">
        <summary>Alege județele <span aria-live="polite" class="service-area-count"></span></summary>
        <!-- One Spring binding marker for the whole group, not one multipart part per county. -->
        <input name="_serviceCounties" type="hidden" value="on">
        <div class="service-area-grid">
            <div class="form-check" th:each="county, state : ${serviceCountyOptions}">
                <input class="form-check-input service-area-county" name="serviceCounties"
                       th:checked="${profile.serviceCounties.contains(county)}" th:id="|serviceCounty-${state.index}|"
                       th:value="${county}" type="checkbox">
                <label class="form-check-label" th:for="|serviceCounty-${state.index}|"
                       th:text="${county}"></label>
            </div>
        </div>
    </details>
    <p aria-live="polite" class="service-area-hint form-text mb-0"></p>
    <div class="text-danger small mt-1" th:errors="*{serviceCounties}"
         th:if="${#fields.hasErrors('serviceCounties')}"></div>
    <div class="text-danger small mt-1" th:errors="*{serviceAreaValid}"
         th:if="${#fields.hasErrors('serviceAreaValid')}"></div>
</fieldset>

<div class="service-area-display" th:fragment="display(business)"
     th:with="counties=${business.serviceCounties}">
    <span class="service-area-badge" th:if="${business.nationwide}">
        <i aria-hidden="true" class="bi bi-geo-alt"></i> Toată țara
    </span>
    <th:block th:unless="${business.nationwide}">
        <span class="service-area-badge" th:each="county, state : ${counties}"
              th:if="${state.index < 5}" th:text="${county}"></span>
        <details class="service-area-more" th:if="${#lists.size(counties) > 5}">
            <summary th:aria-label="|Arată sau ascunde celelalte ${#lists.size(counties) - 5} județe|">
                <span class="service-area-show" th:text="|+${#lists.size(counties) - 5}|"></span>
                <span class="service-area-hide">− Mai puține</span>
            </summary>
            <div class="service-area-extra">
                <span class="service-area-badge" th:each="county, state : ${counties}"
                      th:if="${state.index >= 5}" th:text="${county}"></span>
            </div>
        </details>
    </th:block>
</div>
</body>
</html>
