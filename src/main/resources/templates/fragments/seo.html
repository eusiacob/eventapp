<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="head">
        <title th:text="${seo.title}">M-Event</title>
        <meta name="description" th:content="${seo.description}">
        <meta name="robots" th:content="${seo.robots}">
        <link rel="canonical" th:href="${seo.canonical}">
        <meta property="og:type" content="website">
        <meta property="og:locale" content="ro_RO">
        <meta property="og:site_name" content="M-Event">
        <meta property="og:title" th:content="${seo.title}">
        <meta property="og:description" th:content="${seo.description}">
        <meta property="og:url" th:content="${seo.canonical}">
        <meta property="og:image" th:content="${seo.image}">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" th:content="${seo.title}">
        <meta name="twitter:description" th:content="${seo.description}">
        <meta name="twitter:image" th:content="${seo.image}">
        <script type="application/ld+json" th:if="${seo.structuredData != null}" th:utext="${seo.structuredData}"></script>
    </th:block>
</head>
</html>
