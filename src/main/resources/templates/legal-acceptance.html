<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Actualizare documente legale</title>

    <link rel="icon" th:href="@{/images/favicon.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="app-bg">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-check fs-1 text-dark"></i>
                        <h1 class="h3 fw-bold mt-3">Documente actualizate</h1>
                        <p class="text-muted mb-0">
                            Te rugăm să citești și să confirmi documentele de mai jos pentru a continua.
                        </p>
                    </div>

                    <form method="post" th:action="@{/profile/legal-acceptance}" th:object="${acceptance}">
                        <div class="form-check mb-3">
                            <input class="form-check-input" id="privacyAccepted"
                                   th:field="*{privacyAccepted}" type="checkbox">
                            <label class="form-check-label" for="privacyAccepted">
                                Am citit <a target="_blank" th:href="@{/privacy}">Politica de confidențialitate</a>.
                            </label>
                            <div class="text-danger small mt-1" th:errors="*{privacyAccepted}"></div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" id="termsAccepted"
                                   th:field="*{termsAccepted}" type="checkbox">
                            <label class="form-check-label" for="termsAccepted">
                                Accept <a target="_blank" th:href="@{/terms}">Termenii și condițiile</a>.
                            </label>
                            <div class="text-danger small mt-1" th:errors="*{termsAccepted}"></div>
                        </div>

                        <button class="btn btn-dark w-100" type="submit">Confirmă și continuă</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
