<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Recenziile mele</title>

    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        body {
            margin: 0;
            background: #f7f7f7;
            color: #202020;
        }


        .ratings-page {
            min-height: 100vh;
            padding-bottom: 60px;
        }


        .ratings-wrapper {
            max-width: 850px;
            margin: 0 auto;
        }


        /* HEADER */

        .ratings-header {
            text-align: center;
            margin-bottom: 30px;
        }


        .ratings-title {
            margin: 0;

            color: #181818;

            font-size: 1.9rem;
            font-weight: 700;

            letter-spacing: -.025em;
        }


        .ratings-subtitle {
            margin-top: 8px;

            color: #888;

            font-size: .82rem;
        }


        /* SUMMARY */

        .ratings-summary {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-bottom: 30px;

            padding: 20px;

            background: #fff;

            border: 1px solid #e2e2e2;

            border-radius: 14px;
        }


        .average-rating {

            color: #222;

            font-size: 2rem;

            font-weight: 750;
        }


        .average-stars {

            color: #b99a3a;

            font-size: 1rem;

            letter-spacing: 2px;
        }


        .average-label {

            margin-top: 3px;

            color: #888;

            font-size: .7rem;
        }


        /* REVIEW */

        .reviews-list {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .review-card {

            padding: 20px;

            background: #fff;

            border: 1px solid #e3e3e3;

            border-radius: 14px;

            transition: border-color .2s ease,
            box-shadow .2s ease;
        }


        .review-card:hover {

            border-color: #d2d2d2;

            box-shadow: 0 5px 18px rgba(0, 0, 0, .04);
        }


        .review-top {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }


        .review-stars {

            color: #b99a3a;

            font-size: .9rem;

            letter-spacing: 1px;
        }


        .review-date {

            color: #999;

            font-size: .68rem;
        }


        .review-business {

            margin-top: 10px;

            color: #333;

            font-size: .82rem;

            font-weight: 700;
        }


        .review-comment {

            margin-top: 8px;

            color: #666;

            font-size: .8rem;

            line-height: 1.6;
        }


        /* STATUS */

        .review-status {

            display: inline-block;

            margin-top: 12px;

            padding: 4px 9px;

            border-radius: 20px;

            font-size: .62rem;

            font-weight: 700;
        }


        .status-pending {

            background: #f5f5f5;

            color: #777;
        }


        /* EMPTY */

        .empty-reviews {

            padding: 45px 20px;

            text-align: center;

            background: #fff;

            border: 1px solid #e3e3e3;

            border-radius: 14px;

            color: #888;

            font-size: .82rem;
        }


        @media (max-width: 600px) {

            .ratings-wrapper {

                padding: 30px 15px;
            }


            .ratings-title {

                font-size: 1.65rem;
            }


            .review-top {

                align-items: flex-start;

                flex-direction: column;

                gap: 5px;
            }

        }

    </style>

</head>

<body class="app-bg">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="ratings-page">

        <main class="ratings-wrapper">

            <!-- HEADER -->
            <header class="ratings-header">

                <h1 class="ratings-title">

                    Recenziile mele

                </h1>

                <p class="ratings-subtitle">

                    Recenziile și evaluările pe care le-ai oferit.

                </p>

            </header>

            <!-- SUMMARY -->
            <section
                    class="ratings-summary"
                    th:if="${!reviews.isEmpty()}">

                <div>

                    <div class="average-rating"
                         th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">
                        4.5

                    </div>

                    <div class="average-label">

                        Rating mediu

                    </div>

                </div>

                <div>

                    <div class="average-stars">

                        ★★★★★

                    </div>

                    <div
                            class="average-label"
                            th:text="${reviews.size() + ' recenzii'}">

                        10 recenzii

                    </div>

                </div>

            </section>


            <!-- REVIEWS -->
            <section class="reviews-list"
                     th:if="${!reviews.isEmpty()}">


                <article
                        class="review-card"
                        th:each="review : ${reviews}"
                        th:if="${review.reviewStatus.name() != 'REJECTED'}">


                    <div class="review-top">

                        <div class="review-stars"
                             th:with="stars=${review.rating}">

              <span th:each="i : ${#numbers.sequence(1, 5)}"
                    th:text="${i <= stars ? '★' : '☆'}">
                ★
              </span>

                        </div>

                        <div class="review-date"
                             th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy')}">
                            12.08.2026

                        </div>


                    </div>

                    <div class="review-business"
                         th:text="${review.businessProfile != null
                        ? review.businessProfile.name
                        : 'Serviciu'}">
                        Business
                    </div>


                    <div class="review-comment"
                         th:text="${review.comment}">

                        Serviciu foarte bun.

                    </div>

                    <span class="review-status status-pending"
                          th:if="${review.reviewStatus.name() == 'PENDING'}">
                        În așteptare
                    </span>

                </article>

            </section>


            <!-- EMPTY -->
            <div class="empty-reviews"
                 th:if="${reviews.isEmpty()}">

                Nu ai scris încă nicio recenzie.

            </div>

        </main>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
