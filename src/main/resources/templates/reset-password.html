<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">

    <title>Resetare parolă | M-Event</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="auth-page auth-shell auth-reset-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-wrapper">

    <div class="container">

        <div class="row align-items-center justify-content-center g-3">

            <!-- RESET PASSWORD CARD -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <h3 class="fw-bold mb-2">
                            Resetare parolă
                        </h3>

                    </div>

                    <div class="alert alert-danger p-1"
                         th:if="${param.error != null and param.error[0] == 'passwordMismatch'}">
                        Parolele nu se potrivesc!
                    </div>

                    <div class="alert alert-danger p-1"
                         th:if="${param.error != null and param.error[0] == 'passwordTooShort'}">
                        Parola trebuie să conțină cel puțin 8 caractere.
                    </div>

                    <div class="alert alert-danger p-1"
                         th:if="${param.error != null and param.error[0] == 'invalidToken'}">
                        Linkul de resetare este invalid sau a expirat. Solicită unul nou.
                    </div>

                    <form method="post"
                          th:action="@{/reset-password}">

                        <!-- TOKEN -->

                        <input name="token"
                               th:value="${token}"
                               type="hidden">


                        <!-- PASSWORD -->

                        <div class="mb-2">

                            <input class="form-control"
                                   id="password"
                                   name="password"
                                   autocomplete="new-password"
                                   placeholder="Parolă nouă"
                                   minlength="8"
                                   required
                                   type="password">

                            <span class="text-muted" style="font-size: 0.8rem !important;">*Minim 8 caractere!</span>

                        </div>

                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <input class="form-control"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   autocomplete="new-password"
                                   placeholder="Confirmă parola"
                                   minlength="8"
                                   required
                                   type="password">

                        </div>


                        <button class="btn btn-dark w-100 mt-2"
                                type="submit">

                            Resetează parola

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
