<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">

    <title>Resetare parolă</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="auth-page" style="padding-top: 0 !important;">

<div class="auth-wrapper">

    <div class="container">

        <div class="row align-items-center justify-content-center g-5">

            <!-- LEFT TEXT -->
            <div class="col-lg-6 d-none d-lg-block">

                <div class="auth-info">

                    <span class="badge bg-light text-dark px-3 py-2 mb-4">
                        Market pentru evenimente
                    </span>

                    <h1 class="fw-bold mb-4">
                        Recuperează-ți accesul la cont.
                    </h1>

                    <p>
                        Setează o parolă nouă și continuă să folosești
                        M-Event.
                    </p>

                </div>

            </div>


            <!-- RESET PASSWORD CARD -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold mb-2 text-dark">
                            Resetare parolă
                        </h2>

                        <p class="text-muted mb-0">
                            Introdu noua parolă pentru contul tău.
                        </p>

                    </div>

                  <div class="alert alert-danger p-2"
                       th:if="${param.error}">
                    Parolele nu se potrivesc!
                  </div>

                    <form method="post"
                          th:action="@{/reset-password}">

                        <!-- TOKEN -->

                        <input name="token"
                               th:value="${token}"
                               type="hidden">


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <input class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Parolă nouă"
                                   required
                                   type="password">

                        </div>


                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <input class="form-control"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   placeholder="Confirmă parola"
                                   required
                                   type="password">

                        </div>


                        <button class="btn btn-dark w-100 mt-2"
                                type="submit">

                            Resetează parola

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <a class="auth-link"
                           href="/login">

                            Intră în cont

                        </a>

                    </div>


                    <div class="text-center mt-3">

                        <a class="auth-link"
                           href="/businesses">

                            Continuă ca vizitator

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
