<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Serviciile mele</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- PAGE -->
<div class="container mt-2" style="min-height: 100vh">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <!-- EMPTY STATE -->
    <div class="text-muted mt-4"
         th:if="${#lists.isEmpty(profiles)}">
        Încă nu ai nici un serviciu.
    </div>

    <div th:if="${param.businessCreated}" class="alert alert-success">
        Serviciu adăugat și trimis către aprobare!
    </div>

    <div th:if="${param.businessDeleted}" class="alert alert-success">
        Serviciu șters! Acțiunea este ireversibilă!
    </div>

    <div th:if="${param.businessUpdated}" class="alert alert-success">
        Serviciu actualizat și trimis către aprobare!
    </div>

    <!-- CARDS -->
    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="p : ${profiles}">
            <a class="business-card-link" th:href="@{/business/{uuid}(uuid=${p.uuid})}">

                <div class="card shadow-sm h-100">

                    <div class="card-body" style="position: relative; overflow: hidden;">

                        <div th:if="${p.status.name() == 'APPROVED'}"
                             class="status-ribbon approved">

                            <i class="bi bi-check-circle-fill"></i>
                            APROBAT
                        </div>

                        <div th:if="${p.status.name() == 'PENDING'}"
                             class="status-ribbon pending">

                            <i class="bi bi-hourglass-split"></i>
                            ÎN AȘTEPTARE
                        </div>

                        <div th:if="${p.status.name() == 'REJECTED'}"
                             class="status-ribbon rejected">

                            <i class="bi bi-x-circle-fill"></i>
                            RESPINS
                        </div>

                        <img alt="business profile picture"
                             loading="lazy"
                             class="img-fluid rounded mb-2"
                             style="height:200px; object-fit:cover; width:100%"
                             th:if="${p.imagePath != null}"
                             th:src="@{${p.imagePath}}">

                        <h5 class="card-title"
                            th:text="${p.name}">
                        </h5>

                        <p class="card-text mb-1">
                            <strong>Categorie:</strong>
                            <span th:text="${p.category.displayName}"></span>
                        </p>

                        <p class="card-text mb-1">
                            <strong>Județ:</strong>
                            <span th:text="${p.city}"></span>
                        </p>

                        <div class="d-flex align-items-stretch">

                            <a class="btn btn-outline-dark w-100"
                               style="margin-right: 10px"
                               th:href="@{/business/edit/{uuid}(uuid=${p.uuid})}">
                                Modifică
                            </a>

                            <form method="post"
                                  th:action="@{/business/delete/{uuid}(uuid=${p.uuid})}">

                                <button class="btn btn-outline-danger w-100"
                                        onclick="return confirm('Ești sigur că vrei să ștergi acest serviciu? Operațiunea de recuperare este indisponibilă.')"
                                        type="submit">
                                    Șterge
                                </button>

                            </form>

                        </div>

                    </div>

                </div>
            </a>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
