<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Abonamente</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--MAIN PAGE-->
<div class="container py-2">

    <div class="text-center mb-5">

        <h1 class="fw-bold text-dark">
            Alege abonamentul potrivit
        </h1>

        <p class="text-muted">
            Activează-ți profilul Business și oferă clienților
            acces la serviciile tale.
        </p>

    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-12 col-md-6 col-lg-4"
             th:each="plan : ${plans}">

            <div class="card h-100 border-0 shadow-sm">

                <div class="card-body p-4 text-center">

                    <h3 class="fw-bold"
                        th:text="${plan.name}">
                    </h3>

                    <p class="text-muted"
                       th:text="${plan.description}">
                    </p>

                    <div class="my-4">

                    <span class="display-5 fw-bold"
                          th:text="${plan.price + ' lei'}">
                    </span>

                        <span class="text-muted"
                              th:if="${plan.durationMonths == 1}">
                        / lună
                    </span>

                        <span class="text-muted"
                              th:if="${plan.durationMonths == 6}">
                        / 6 luni
                    </span>

                        <span class="text-muted"
                              th:if="${plan.durationMonths == 12}">
                        / an
                    </span>

                    </div>

                    <a th:href="@{/subscriptions/confirm(plan=${plan.plan})}"
                       class="btn btn-primary w-100">

                        Alege abonamentul

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
