<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Abonamente</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--MAIN PAGE-->
<div class="container py-2">

    <div class="text-center mb-5">

        <h1 class="fw-bold text-dark">
            Alege abonamentul
        </h1>

        <p class="text-muted">
            Alege planul potrivit pentru afacerea ta.
        </p>

    </div>


    <div class="row g-4 justify-content-center">


        <!-- STANDARD -->

        <div class="col-12 col-lg-5">

            <div class="card h-100 shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Standard
                        </h2>

                        <p class="text-muted">
                            Funcțiile esențiale pentru afacerea ta.
                        </p>

                    </div>


                    <div class="list-group list-group-flush">

                        <div th:each="plan : ${plans}"
                             th:if="${plan.type.name() == 'STANDARD'}"
                             class="list-group-item px-0">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center">

                                <div>

                                    <strong
                                            th:switch="${plan.duration}">

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).MONTHLY}">
                                            1 lună
                                        </span>

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).SIX_MONTHS}">
                                            6 luni
                                        </span>

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).YEARLY}">
                                            1 an
                                        </span>

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).TWO_YEARS}">
                                            2 ani
                                        </span>

                                    </strong>

                                </div>


                                <div class="text-end">

                                    <div class="fw-bold"
                                         th:text="${plan.price + ' lei'}">
                                    </div>

                                    <a th:href="@{/subscriptions/confirm(
                                            planId=${plan.id}
                                        )}"
                                       class="btn btn-sm btn-primary mt-1">

                                        Alege

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- PREMIUM -->

        <div class="col-12 col-lg-5">

            <div class="card h-100 shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Premium
                        </h2>

                        <p class="text-muted">
                            Funcții avansate pentru afacerea ta.
                        </p>

                    </div>


                    <div class="list-group list-group-flush">

                        <div th:each="plan : ${plans}"
                             th:if="${plan.type.name() == 'PREMIUM'}"
                             class="list-group-item px-0">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center">

                                <div>

                                    <strong
                                            th:switch="${plan.duration}">

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).MONTHLY}">
                                            1 lună
                                        </span>

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).SIX_MONTHS}">
                                            6 luni
                                        </span>

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).YEARLY}">
                                            1 an
                                        </span>

                                        <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).TWO_YEARS}">
                                            2 ani
                                        </span>

                                    </strong>

                                </div>


                                <div class="text-end">

                                    <div class="fw-bold"
                                         th:text="${plan.price + ' lei'}">
                                    </div>

                                    <a th:href="@{/subscriptions/confirm(
                                            planId=${plan.id}
                                        )}"
                                       class="btn btn-sm btn-primary mt-1">

                                        Alege

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
