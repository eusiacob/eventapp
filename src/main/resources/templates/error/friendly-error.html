<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${statusCode + ' - ' + errorTitle}">Eroare</title>

    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <section class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 720px;">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="display-1 text-primary mb-3">
                <i class="bi bi-exclamation-triangle"></i>
            </div>

            <p class="text-uppercase text-muted fw-semibold small mb-2">
                Cod eroare <span th:text="${statusCode}">500</span>
            </p>

            <h1 class="h3 fw-bold mb-3" th:text="${errorTitle}">
                A apărut o eroare
            </h1>

            <p class="text-muted mb-4" th:text="${errorMessage}">
                Te rugăm să încerci din nou mai târziu.
            </p>

            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <a class="btn btn-primary px-4"
                   th:href="${errorActionHref}"
                   th:text="${errorActionText}">
                    Înapoi la pagina principală
                </a>

                <button class="btn btn-outline-secondary px-4"
                        onclick="history.back()"
                        type="button">
                    Înapoi
                </button>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script crossorigin="anonymous"
        integrity="sha384-YUe2LzesAfftltw+PEaao2tjU/QATaW/rOitAq67e0CT0Zi2VVRL0oC4+gAaeBKu"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
