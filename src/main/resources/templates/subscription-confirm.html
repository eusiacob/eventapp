<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Abonamente</title>

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--MAIN PAGE-->
<div class="container py-2">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5 text-center">

                    <h2 class="fw-bold mb-4">
                        Confirmă abonamentul
                    </h2>


                    <h3
                            th:text="${plan.type}">
                    </h3>


                    <div class="my-4">

                        <span class="display-5 fw-bold"
                              th:text="${plan.price + ' lei'}">
                        </span>

                    </div>


                    <p class="text-muted">

                        Durată:

                        <strong
                                th:switch="${plan.duration}">

                            <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).MONTHLY}">
                                1 lună
                            </span>

                            <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).SIX_MONTHS}">
                                6 luni
                            </span>

                            <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).YEARLY}">
                                1 an
                            </span>

                            <span th:case="${T(com.example.eventapp.model.SubscriptionPlan.SubscriptionDuration).TWO_YEARS}">
                                2 ani
                            </span>

                        </strong>

                    </p>


                    <form th:action="@{/subscriptions/create}"
                          method="post">

                        <input type="hidden"
                               name="planId"
                               th:value="${plan.id}">


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Confirmă abonamentul

                        </button>

                    </form>


                    <a th:href="@{/subscriptions}"
                       class="btn btn-link mt-3">

                        Înapoi la abonamente

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
