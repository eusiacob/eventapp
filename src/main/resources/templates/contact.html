<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">

    <title>Contact - M-Event</title>

    <link rel="icon"
          th:href="@{/images/favicon.png}"
          type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-4">

    <div th:replace="~{fragments/breadcrumb :: breadcrumbs(${breadcrumbs})}"></div>

    <div class="row justify-content-center">

        <div class="col-12 col-md-10 col-lg-8">

            <!-- Titlu -->

            <div class="text-center mb-4">

                <h1 class="text-dark fw-bold">
                    Contactează-ne
                </h1>

                <p class="text-muted mt-2">
                    Ai o întrebare, o sugestie sau ai nevoie de ajutor?
                    Trimite-ne un mesaj și îți vom răspunde cât mai curând.
                </p>

            </div>


            <!-- Mesaj succes -->

            <div class="alert alert-success"
                 th:if="${param.success != null}">

                Mesajul tău a fost trimis cu succes.
                Îți mulțumim că ai contactat M-Event!

            </div>


            <!-- Mesaj eroare trimitere -->

            <div class="alert alert-danger"
                 th:if="${mailError != null}"
                 th:text="${mailError}">
            </div>


            <!-- Formular -->

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <form method="post"
                          th:action="@{/contact}"
                          th:object="${contactForm}">

                        <!-- Nume -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold"
                                   for="name">
                                Nume
                            </label>

                            <input class="form-control"
                                   id="name"
                                   maxlength="100"
                                   placeholder="Numele tău"
                                   th:field="*{name}"
                                   type="text">

                            <div class="text-danger small mt-1"
                                 th:errors="*{name}"
                                 th:if="${#fields.hasErrors('name')}">
                            </div>

                        </div>


                        <!-- Email -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold"
                                   for="email">
                                Adresă email
                            </label>

                            <input class="form-control"
                                   id="email"
                                   maxlength="150"
                                   placeholder="exemplu@email.com"
                                   th:field="*{email}"
                                   type="email">

                            <div class="text-danger small mt-1"
                                 th:errors="*{email}"
                                 th:if="${#fields.hasErrors('email')}">
                            </div>

                        </div>


                        <!-- Subiect -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold"
                                   for="subject">
                                Subiect
                            </label>

                            <input class="form-control"
                                   id="subject"
                                   maxlength="150"
                                   placeholder="Subiectul mesajului"
                                   th:field="*{subject}"
                                   type="text">

                            <div class="text-danger small mt-1"
                                 th:errors="*{subject}"
                                 th:if="${#fields.hasErrors('subject')}">
                            </div>

                        </div>


                        <!-- Mesaj -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold"
                                   for="message">
                                Mesaj
                            </label>

                            <textarea class="form-control"
                                      id="message"
                                      maxlength="5000"
                                      placeholder="Scrie mesajul tău aici..."
                                      rows="7"
                                      th:field="*{message}"></textarea>

                            <div class="text-danger small mt-1"
                                 th:errors="*{message}"
                                 th:if="${#fields.hasErrors('message')}">
                            </div>

                        </div>


                        <!-- GDPR -->

                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   id="privacyAccepted"
                                   th:field="*{privacyAccepted}"
                                   type="checkbox">

                            <label class="form-check-label"
                                   for="privacyAccepted">

                                Sunt de acord cu
                                <a target="_blank"
                                   th:href="@{/privacy}">
                                    Politica de confidențialitate
                                </a>.

                            </label>

                            <div class="text-danger small mt-1"
                                 th:errors="*{privacyAccepted}"
                                 th:if="${#fields.hasErrors('privacyAccepted')}">
                            </div>

                        </div>


                        <!-- Buton -->

                        <div class="d-grid">

                            <button class="btn btn-dark btn-lg"
                                    type="submit">

                                <i class="bi bi-send me-2"></i>
                                Trimite mesajul

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
