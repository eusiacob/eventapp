<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Înregistrare | M-Event</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="auth-page auth-shell auth-register-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-wrapper">

    <div class="container">

        <div class="row align-items-center justify-content-center g-3">

            <!-- REGISTER CARD -->
            <div class="col-12">

                <div class="auth-card">

                    <div class="text-center mb-2">

                        <h3 class="fw-bold mb-2">
                            Creare cont
                        </h3>

                    </div>

                    <form method="post"
                          th:action="@{/register}"
                          th:object="${user}">

                        <div class="row g-3 auth-register-layout">
                            <div class="col-12 col-lg-6">
                                <div class="row g-2">
                                    <div class="col-12 col-md-6">
                                        <input autofocus class="form-control" placeholder="Prenume"
                                               pattern="(?:\p{L}\p{M}*)+(?: +(?:\p{L}\p{M}*)+)*"
                                               title="Doar litere, inclusiv diacritice, și spații între nume."
                                               autocomplete="given-name" required minlength="3" maxlength="10"
                                               th:field="*{firstName}" type="text">
                                        <div class="text-danger small mt-1" th:errors="*{firstName}"
                                             th:if="${#fields.hasErrors('firstName')}"></div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <input class="form-control" placeholder="Nume"
                                               pattern="(?:\p{L}\p{M}*)+(?: +(?:\p{L}\p{M}*)+)*"
                                               title="Doar litere, inclusiv diacritice, și spații între nume."
                                               autocomplete="family-name" required minlength="3" maxlength="10"
                                               th:field="*{lastName}" type="text">
                                        <div class="text-danger small mt-1" th:errors="*{lastName}"
                                             th:if="${#fields.hasErrors('lastName')}"></div>
                                    </div>
                                    <div class="col-12">
                                        <input class="form-control" autocomplete="email" placeholder="nume@exemplu.ro"
                                               th:field="*{email}" type="email">
                                        <div class="text-danger small mt-1" th:errors="*{email}"
                                             th:if="${#fields.hasErrors('email')}"></div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <input class="form-control" placeholder="Parolă" th:field="*{password}"
                                               autocomplete="new-password" type="password">
                                        <span class="auth-password-hint text-muted">*Minim 8 caractere!</span>
                                        <div class="text-danger small mt-1" th:errors="*{password}"
                                             th:if="${#fields.hasErrors('password')}"></div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <input class="form-control" placeholder="Confirmare parolă"
                                               th:field="*{confirmPassword}" autocomplete="new-password" type="password">
                                        <div class="text-danger small mt-1" th:errors="*{confirmPassword}"
                                             th:if="${#fields.hasErrors('confirmPassword')}"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-lg-6 auth-register-preferences">
                                <div th:replace="~{fragments/account-purpose :: choices(${user.accountPurpose})}"></div>
                                <div class="text-danger small" th:errors="*{accountPurpose}"></div>
                                <div class="text-danger small" th:errors="*{accountPurposeValid}"></div>

                                <div class="form-check mb-2">
                                    <input class="form-check-input" id="privacyAccepted" th:field="*{privacyAccepted}" type="checkbox">
                                    <label class="form-check-label fw-normal" for="privacyAccepted">
                                        Sunt de acord cu <a target="_blank" th:href="@{/privacy}">Politica de confidențialitate</a>
                                    </label>
                                    <div class="text-danger small mt-1" th:errors="*{privacyAccepted}"
                                         th:if="${#fields.hasErrors('privacyAccepted')}"></div>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" id="termsAccepted" th:field="*{termsAccepted}" type="checkbox">
                                    <label class="form-check-label fw-normal" for="termsAccepted">
                                        Am citit și accept <a target="_blank" th:href="@{/terms}">Termenii și condițiile</a>
                                    </label>
                                    <div class="text-danger small mt-1" th:errors="*{termsAccepted}"
                                         th:if="${#fields.hasErrors('termsAccepted')}"></div>
                                </div>
                                <button class="btn btn-dark w-100 mt-2" type="submit">Înregistrare</button>
                            </div>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
