<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Recuperare parolă | M-Event</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="auth-page auth-shell auth-forgot-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-wrapper">

    <div class="container">

        <div class="row align-items-center justify-content-center g-3">

            <!-- REGISTER CARD -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="auth-card">

                    <div class="mb-2">

                        <h3 class="fw-bold text-center mb-2">
                            Recuperare parolă
                        </h3>

                        <div class="alert alert-success p-1"
                             th:if="${param.successForgot}">
                            Dacă adresa de email este înregistrată vei primi instrucțiunile necesare pe email pentru resetarea parolei.
                        </div>

                    </div>

                    <form method="post"
                          th:action="@{/forgot}">

                        <div class="row g-3">

                            <div class="col-12">
                                <input class="form-control"
                                       id="email"
                                       name="email"
                                       autocomplete="email"
                                       placeholder="Introdu adresa de email a contului"
                                       type="email"
                                       required>
                            </div>

                            <div class="col-12">
                                <button class="btn btn-dark w-100 mt-2"
                                        type="submit">
                                    Recuperare parola
                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
